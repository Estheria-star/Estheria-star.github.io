<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>服务协议与隐私政策</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #000;
            overflow: hidden;
        }

        /* 弹窗遮罩 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        /* 弹窗 */
        .dialog {
            width: 85%;
            max-width: 400px;
            background: white;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
        }

        .dialog h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .dialog p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* 按钮 */
        #agreeBtn {
            width: 100%;
            height: 45px;
            border-radius: 22px;
            background: #07c160;
            color: white;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }

        #agreeBtn:active {
            opacity: 0.9;
        }

        /* 视频容器 */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: none;
        }

        /* iframe 铺满全屏 */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 隐藏 */
        .hide {
            display: none !important;
        }

        /* 显示 */
        .show {
            display: block !important;
        }
    </style>
</head>

<body>
    <!-- 弹窗 -->
    <div id="overlay" class="overlay">
        <div class="dialog">
            <h3>隐私协议</h3>
            <p>点击同意后即可继续使用服务</p>
            <button id="agreeBtn">同意并继续</button>
        </div>
    </div>

    <!-- 视频区域（iframe嵌入） -->
    <div id="videoContainer" class="video-container">
        <iframe 
            src="https://www.bilibili.com/video/BV1GJ411x7h7/?spm_id_from=333.337.search-card.all.click&vd_source=53954458a5ec43fb73b2ce0aa8f4e859"
            allow="autoplay"
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const agreeBtn = document.getElementById('agreeBtn');
        const overlay = document.getElementById('overlay');
        const videoContainer = document.getElementById('videoContainer');

        agreeBtn.onclick = function () {
            // 隐藏弹窗
            overlay.classList.add('hide');
            // 显示视频
            videoContainer.classList.add('show');
        }
    </script>
</body>
</html>
