<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "超位魔法阵",
  "url": "https://startian.top/sigil/",
  "applicationCategory": "Game",
  "operatingSystem": "Any",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CNY" },
  "description": "六阶段魔法演出：法阵、领域展开、超位爆发、无量空处，六套配色与实时参数。"
}

<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#05040c;
 font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#e8ecf8;touch-action:none}
#cv{display:block;position:fixed;inset:0;z-index:1}
/* ── 阶段标题 ── */
#stage{position:fixed;top:8%;left:0;right:0;z-index:5;text-align:center;pointer-events:none}
#stageN{font-size:34px;font-weight:800;letter-spacing:14px;text-shadow:0 0 30px currentColor;opacity:0;transition:opacity .5s}
#stageS{font-size:12px;letter-spacing:5px;color:#7b6bb5;margin-top:8px;opacity:0;transition:opacity .5s}
/* ── 控制面板 ── */
#ui{position:fixed;top:16px;right:16px;z-index:6;width:236px;
 background:rgba(12,9,26,.72);border:1px solid rgba(139,92,246,.35);border-radius:14px;
 padding:12px 14px;backdrop-filter:blur(10px);font-size:12px;max-height:94vh;overflow-y:auto}
#ui.hide{transform:translateX(260px);opacity:0;pointer-events:none}
#ui{transition:transform .3s,opacity .3s}
.u-t{font-size:12px;color:#a78bfa;font-weight:700;letter-spacing:2px;margin:10px 0 6px}
.u-t:first-child{margin-top:0}
.sw{display:flex;flex-wrap:wrap;gap:5px}
.s-c{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.15s}
.s-c:hover{transform:scale(1.12)}
.s-c.sel{border-color:#fff;box-shadow:0 0 12px currentColor}
.btn{flex:1;min-width:66px;padding:7px 4px;font-size:11.5px;border:none;border-radius:8px;cursor:pointer;
 background:linear-gradient(135deg,#5b21b6,#7c3aed);color:#fff;font-weight:700;transition:.15s}
.btn:hover{filter:brightness(1.25)}
.btn:active{transform:scale(.95)}
.btn.gold{background:linear-gradient(135deg,#b45309,#f59e0b)}
.rw{display:flex;align-items:center;gap:7px;margin:5px 0}
.rw label{flex:0 0 58px;color:#8ea2d8;font-size:11px}
.rw input[type=range]{flex:1;accent-color:#a78bfa;height:3px}
.rw b{flex:0 0 30px;text-align:right;color:#fbbf24;font-size:10.5px;font-weight:600}
.ch{display:flex;align-items:center;gap:6px;margin:4px 0;cursor:pointer;color:#8ea2d8;font-size:11px}
.ch input{accent-color:#a78bfa;cursor:pointer}
#fps{position:fixed;left:14px;bottom:52px;z-index:6;font-size:11px;color:#5b5280;font-variant-numeric:tabular-nums}
#tip{position:fixed;bottom:12px;left:0;right:0;z-index:5;text-align:center;font-size:11.5px;color:#6b5f96;pointer-events:none}
#toggle{position:fixed;top:16px;right:16px;z-index:7;width:34px;height:34px;border-radius:9px;cursor:pointer;
 background:rgba(124,58,237,.35);border:1px solid rgba(167,139,250,.5);color:#ddd6fe;font-size:15px;display:none;
 align-items:center;justify-content:center}
#ui.hide~#toggle{display:flex}
@media(max-width:640px){
 #ui{width:190px;top:10px;right:10px;padding:10px;font-size:11px}
 #stageN{font-size:22px;letter-spacing:8px}
 .rw label{flex:0 0 46px}
}
#line{position:fixed;bottom:16%;left:0;right:0;z-index:8;text-align:center;
pointer-events:none;opacity:0;transition:opacity .7s}
#line.on{opacity:1}
#lineJp{font-size:clamp(22px,4.6vw,48px);font-weight:800;letter-spacing:.16em;
color:#fff;text-shadow:0 0 26px #a78bfa,0 0 74px #7c3aed,0 2px 6px #000}
/* —— 返回主页（全站统一 · 2026-09-29）—— */
.wb-home{position:fixed;left:14px;bottom:14px;z-index:9990;display:inline-flex;align-items:center;gap:5px;
  padding:8px 13px 8px 10px;border-radius:999px;text-decoration:none;
  background:rgba(17,24,39,.55);color:#fff;font-size:12.5px;font-weight:600;letter-spacing:.3px;
  -webkit-backdrop-filter:blur(10px) saturate(1.3);backdrop-filter:blur(10px) saturate(1.3);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 6px 18px rgba(0,0,0,.18);
  transition:background .2s,transform .2s,box-shadow .2s}
.wb-home:hover{background:rgba(17,24,39,.78);transform:translateY(-1px);box-shadow:0 10px 24px rgba(0,0,0,.26)}
.wb-home:active{transform:translateY(0)}
.wb-home svg{width:13px;height:13px;flex:0 0 auto}
@media (max-width:620px){ .wb-home{left:10px;bottom:10px;padding:7px 11px 7px 9px;font-size:12px} }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="stage"><div id="stageN"></div><div id="stageS"></div></div>

<div id="ui">
  <div class="u-t">◈ 配色</div>
  <div class="sw" id="swatch"></div>
  <div class="u-t">◈ 施放</div>
  <div class="sw">
    <button class="btn" id="bSigil">法阵</button>
    <button class="btn" id="bDomain">领域</button>
    <button class="btn gold" id="bNova">超位</button>
    <button class="btn" id="bVoid" style="flex-basis:100%;background:linear-gradient(135deg,#1e1b4b,#7c3aed,#fde047)">无量空处</button>
  </div>
  <div class="u-t">◈ 参数</div>
  <div class="rw"><label>符文密度</label><input type="range" id="rGlyph" min="8" max="48" value="28"><b id="vGlyph">28</b></div>
  <div class="rw"><label>旋转速度</label><input type="range" id="rSpin" min="0" max="250" value="100"><b id="vSpin">1.0</b></div>
  <div class="rw"><label>辉光强度</label><input type="range" id="rGlow" min="20" max="220" value="110"><b id="vGlow">1.1</b></div>
  <div class="rw"><label>星尘数量</label><input type="range" id="rDust" min="0" max="220" value="110"><b id="vDust">110</b></div>
  <div class="u-t">◈ 开关</div>
  <label class="ch"><input type="checkbox" id="cAuto" checked>自动演出序列</label>
  <label class="ch"><input type="checkbox" id="cMirror" checked>地面倒影</label>
  <label class="ch"><input type="checkbox" id="cChrom" checked>爆发色差</label>
  <label class="ch"><input type="checkbox" id="cShake" checked>镜头震动</label>
  <label class="ch"><input type="checkbox" id="cBloom" checked>辉光叠加</label>
