/* ───────── §1 常量 · 配色 ───────── */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const rand=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const easeIn=t=>t*t*t;
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* 六套配色：金 / 暗紫 / 金紫混 / 深渊 / 极光青 / 血月 */
const PALETTE={
 gold  :{ring:"#fde047",star:"#fffdf0",glyph:"#f59e0b",core:"#fffdf0",glow:"#f59e0b",aura:"#fbbf24",name:"圣金"},
 violet:{ring:"#a78bfa",star:"#f5f3ff",glyph:"#8b5cf6",core:"#f5f3ff",glow:"#8b5cf6",aura:"#7c3aed",name:"暗紫"},
 mix   :{ring:"#fde047",star:"#c4b5fd",glyph:"#f59e0b",core:"#ffffff",glow:"#8b5cf6",aura:"#a78bfa",name:"金紫"},
 abyss :{ring:"#8b5cf6",star:"#ddd6fe",glyph:"#6d28d9",core:"#e9d5ff",glow:"#4c1d95",aura:"#5b21b6",name:"深渊"},
 aurora:{ring:"#67e8f9",star:"#ecfeff",glyph:"#22d3ee",core:"#ffffff",glow:"#0ea5e9",aura:"#38bdf8",name:"极光"},
 blood :{ring:"#fb7185",star:"#fff1f2",glyph:"#e11d48",core:"#ffffff",glow:"#9f1239",aura:"#be123c",name:"血月"}
};
let CUR="mix";

/* ───────── §2 数学 · 几何 ───────── */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gcd2(a,b){return b?gcd2(b,a%b):a;}
/* 星形多边形 {n/step}：gcd>1 自动拆子路径 —— {6/2} 得两个三角＝标准六芒星 */
function starPaths(c,cx,cy,R,n,step,rot){
 const g=gcd2(n,step),sub=n/g;
 for(let s=0;s<g;s++){
  c.beginPath();
  for(let i=0;i<=sub;i++){
   const k=(s+i*step)%n,a=rot+k*TAU/n;
   const x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R;
   i?c.lineTo(x,y):c.moveTo(x,y);
  }
  c.closePath();
 }
}
function polyPath(c,cx,cy,R,n,rot){
 c.beginPath();
 for(let i=0;i<n;i++){const a=rot+i*TAU/n,x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R;i?c.lineTo(x,y):c.moveTo(x,y);}
 c.closePath();
}
/* 程序化符文：折线 + 偶发圆点，无字体依赖 */
function runePath(c,x,y,s,seed){
 const r=mulberry32(seed*9301+49297),n=3+Math.floor(r()*4);
 let px=x+(r()-.5)*s,py=y-s*.55;
 c.beginPath();c.moveTo(px,py);
 for(let i=0;i<n;i++){
  if(r()<.5){px+=(r()-.5)*s*1.15;py+=s*(.26+r()*.44);}
  else{px+=(r()-.5)*s*1.05;py+=(r()-.5)*s*.95;}
  c.lineTo(px,py);
 }
 c.stroke();
 if(r()<.55){c.beginPath();c.arc(x+(r()-.5)*s*.5,y+(r()-.5)*s*.5,Math.max(.7,s*.11),0,TAU);c.fill();}
}

/* ───────── §3 分层法阵贴图（每层独立缓存 → 可各自旋转） ───────── */
const CACHE=new Map();
function q(v){return Math.max(24,Math.round(v/8)*8);}
function cached(key,size,draw){
 let cv=CACHE.get(key);if(cv)return cv;
 cv=document.createElement("canvas");cv.width=cv.height=size;
 const c=cv.getContext("2d");c.translate(size/2,size/2);draw(c,size/2);
 if(CACHE.size>200)CACHE.delete(CACHE.keys().next().value);
 CACHE.set(key,cv);return cv;
}
/* 三重辉光描边：粗淡 → 中透 → 细亮，让线条自带"发光体"质感（贴图生成时一次算好） */
function gStroke(c,color,w,alpha,build){
 c.strokeStyle=color;
 c.globalAlpha=alpha*.26;c.lineWidth=w*3.8;build();c.stroke();
 c.globalAlpha=alpha*.52;c.lineWidth=w*1.9;build();c.stroke();
 c.globalAlpha=alpha;     c.lineWidth=w;     build();c.stroke();
}
/* 层种类：ring 外环刻度 / hex 六芒 / glyph 符文环 / pent 五芒 / core 内核 */
function layer(kind,scheme,R,glyphN,seed){
 const r=q(R),k=kind+"|"+scheme+"|"+r+"|"+glyphN+"|"+seed,S=PALETTE[scheme]||PALETTE.mix;
 return cached(k,r*2,(c,h)=>{
  c.lineCap="round";c.lineJoin="round";
  const B=fn=>{c.beginPath();fn();};
  if(kind==="ring"){
   B(()=>c.arc(0,0,r*.985,0,TAU));gStroke(c,S.ring,Math.max(1,r*.013),.95,()=>0);
   B(()=>c.arc(0,0,r*.905,0,TAU));gStroke(c,S.ring,Math.max(.8,r*.008),.6,()=>0);
   c.strokeStyle=S.glyph;
   for(let i=0;i<72;i+=6){                         // 刻度环分 6 组，组内一次 gStroke
    const grp=i;
    B(()=>{for(let j=grp;j<grp+6;j++){const a=j*TAU/72,r0=r*(j%4?.905:.84);
     c.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);c.lineTo(Math.cos(a)*r*.985,Math.sin(a)*r*.985);}});
    gStroke(c,S.glyph,Math.max(.7,r*.0075),.75,()=>0);
   }
  }else if(kind==="hex"){
   B(()=>starPaths(c,0,0,r*.86,6,2,-Math.PI/2));
   gStroke(c,S.star,Math.max(1,r*.011),.95,()=>0);
   c.globalAlpha=.5;
   B(()=>starPaths(c,0,0,r*.86,12,5,-Math.PI/2));
   gStroke(c,S.star,Math.max(.7,r*.006),.5,()=>0);
   c.globalAlpha=1;
  }else if(kind==="glyph"){
   B(()=>c.arc(0,0,r*.735,0,TAU));
   gStroke(c,S.glyph,Math.max(.7,r*.005),.4,()=>0);
   c.strokeStyle=S.glyph;c.fillStyle=S.glyph;
   for(let i=0;i<glyphN;i++){                     // 符文：先淡粗后亮细
    const a=i*TAU/glyphN-Math.PI/2,x=Math.cos(a)*r*.735,y=Math.sin(a)*r*.735,s=r*.052,sd=seed*31+i*7;
    c.globalAlpha=.30;c.lineWidth=Math.max(1.6,r*.02);runePath(c,x,y,s,sd);
    c.globalAlpha=.95;c.lineWidth=Math.max(.8,r*.009);runePath(c,x,y,s,sd);
   }
   c.globalAlpha=1;
  }else if(kind==="pent"){
   B(()=>starPaths(c,0,0,r*.56,5,2,-Math.PI/2));
   gStroke(c,S.star,Math.max(.9,r*.009),.95,()=>0);
   c.globalAlpha=.5;
   B(()=>polyPath(c,0,0,r*.33,5,-Math.PI/2));
   gStroke(c,S.star,Math.max(.7,r*.006),.5,()=>0);
   c.globalAlpha=1;
  }else if(kind==="core"){
   B(()=>c.arc(0,0,r*.2,0,TAU));gStroke(c,S.ring,Math.max(.9,r*.01),.95,()=>0);
   B(()=>c.arc(0,0,r*.1,0,TAU));gStroke(c,S.ring,Math.max(.8,r*.008),.7,()=>0);
  }
  return cv;
 });
}

/* ───────── §4 设置 ───────── */
const OPT={glyphN:28,spin:1,glow:1.1,dust:110,
 auto:true,mirror:true,chrom:true,shake:true,bloom:true};

/* ───────── §5 粒子系统 ───────── */
const PT={list:[],pool:[]};
function emit(x,y,n,o){
 o=o||{};
 for(let i=0;i<n;i++){
  if(PT.list.length>900)break;
  let p=PT.pool.pop();
  if(!p)p={x:0,y:0,vx:0,vy:0,life:0,max:1,r:1,c:"#fff",k:0,rot:0,vr:0};
  const a=o.a!==undefined?o.a+rand(-o.spread||0,o.spread||0):rand(0,TAU);
  const sp=rand(o.spd0||30,o.spd1||140);
  p.x=x+rand(-(o.jitter||0),o.jitter||0);p.y=y+rand(-(o.jitter||0),o.jitter||0);
  p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;
  p.max=p.life=rand(o.life0||.5,o.life1||1.4);
  p.r=rand(o.r0||1,o.r1||3);
  p.c=o.c||PALETTE[CUR].star;
  p.k=o.k||0;                    // 0 星尘 1 放射火花 2 上浮金粉 3 雾
  p.rot=rand(0,TAU);p.vr=rand(-3,3);
  p.drag=o.drag||.97;
  p.grav=o.grav||0;
  PT.list.push(p);
 }
}
function stepPT(dt){
 for(let i=PT.list.length-1;i>=0;i--){
  const p=PT.list[i];
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  p.vx*=p.drag;p.vy*=p.drag;p.vy+=p.grav*dt;
  p.rot+=p.vr*dt;p.life-=dt;
  if(p.life<=0){PT.pool.push(p);PT.list.splice(i,1);}
 }
}
function drawPT(c){
 c.save();c.globalCompositeOperation="lighter";
 for(const p of PT.list){
  const a=clamp(p.life/p.max,0,1);
  c.globalAlpha=a*(p.k===3?.22:.85);
  c.fillStyle=p.c;
  if(p.k===1){                                   // 放射火花：拖尾短线
   c.strokeStyle=p.c;c.lineWidth=p.r*.7;
   c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.035,p.y-p.vy*.035);c.stroke();
  }else if(p.k===2){                             // 金粉：菱形
   c.save();c.translate(p.x,p.y);c.rotate(p.rot);
   c.beginPath();c.moveTo(0,-p.r*1.8);c.lineTo(p.r*.6,0);c.lineTo(0,p.r*1.8);c.lineTo(-p.r*.6,0);

  }else{

   c.beginPath();c.arc(p.x,p.y,r,0,TAU);c.fill();
  }
 }
 c.restore();

/* 领域展开：幕布 → 法阵 → 格栅 → 天穹 → 光柱 → 符文雨 → 收束 */
function drawDomain(c,d){

 }
 /* ③ 六边格栅（地面透视网格） */
 if(p>.24){
  const gp=clamp((p-.24)/.30,0,1),ga=veil*(1-Math.abs(p-.62)/.42)*.7;

   }

 if(p>.34&&p<.94){

   for(let i=0;i<8;i++){

    c.lineTo(cx+Math.cos(a+.045)*R*1.15,cy+Math.sin(a+.045)*R*1.15);
    c.closePath();c.fill();
   }

 }
 /* ⑥ 符文雨 */
 if(p>.55&&p<.9&&Math.random()<.5){

 if(outP>0){

 }

/* ══════════ §6b 无量空处 · Unlimited Void（强化版 · 2026-10-07） ══════════
   原作意象：被卷入者接收无限信息，空间被彻底改写
   分层：黑洞奇点（暗核 + 亮缘 + 吸积环 + 脉冲波）→ 汇聚星流（螺旋吸入）
        → 3D 符号雨（自转 / 拖尾 / 近景淡出）→ 无限环 → 过载故障（切片错位）
        → 展开 / 塌缩白闪
════════════════════════════════════════════════════════════ */
const VOID={
 sheet:null,parts:[],streams:[],rings:[],
 ZMAX:3.2,ZMIN:0.18,density:640,
 glitchT:0,glitchNext:1.0,pulse:0,pulseT:1.4,lastP:0,ringT:0
};
/* 符号 sprite sheet：24 枚（数学/几何符号 + 程序化符文），生成时上色，运行时零开销 */
function buildGlyphSheet(){
 const cols=8,rows=3,cell=48;
 const cv=document.createElement("canvas");
 cv.width=cols*cell;cv.height=rows*cell;
 const c=cv.getContext("2d");
 const chars=["+","×","∞","∑","∫","√","π","θ","Δ","○","□","◇",
              "※","≡","≠","≤","≥","∇","Ω","λ","ψ","Φ","∀","⌘"];
 const cols3=["#ffffff","#e9d5ff","#c4b5fd","#dbeafe","#fef3c7","#a5b4fc"];
 c.textAlign="center";c.textBaseline="middle";c.lineCap="round";
 for(let i=0;i<cols*rows;i++){
  const x=(i%cols)*cell+cell/2,y=Math.floor(i/cols)*cell+cell/2;
  const col=cols3[Math.floor(Math.random()*cols3.length)];
  c.fillStyle=col;c.strokeStyle=col;
  if(i<chars.length){
   c.font="bold "+Math.round(cell*.6)+"px 'Times New Roman',serif";
   c.fillText(chars[i],x,y);
  }else{
   c.lineWidth=1.7;c.save();c.translate(x,y);runePath(c,0,0,cell*.3,i*7+3);c.restore();
  }
 }
 return {cv,cols,rows,cell};
}
function voidInit(n){
 if(!VOID.sheet)VOID.sheet=buildGlyphSheet();
 VOID.parts.length=0;
 const dense=Math.round((n||VOID.density)*(Math.min(W,H)<700?.68:1));
 for(let i=0;i<dense;i++){
  VOID.parts.push({x:rand(-1.2,1.2),y:rand(-1.2,1.2),
   z:rand(VOID.ZMIN,VOID.ZMAX),pz:VOID.ZMAX,g:Math.random()*24|0,
   ph:rand(0,TAU),tw:rand(1.2,5.5),fl:Math.random()<.08,
   rot:rand(0,TAU),vr:rand(-1.8,1.8)});
 }
 VOID.streams.length=0;
 for(let i=0;i<56;i++){
  VOID.streams.push({a:i*TAU/56+rand(-.05,.05),r:rand(.1,1.25),
   sp:rand(.55,1.5),g:Math.random()*24|0,ph:rand(0,TAU)});
 }
 VOID.rings.length=0;VOID.ringT=.5;
 VOID.glitchT=0;VOID.glitchNext=rand(.7,1.3);
 VOID.pulse=0;VOID.pulseT=1.2;VOID.lastP=0;
}
function voidStep(dt,speed,p){
 const ZM=VOID.ZMAX,ZN=VOID.ZMIN;
 for(const pt of VOID.parts){
  pt.pz=pt.z;
  pt.z-=speed*dt;
  pt.rot+=pt.vr*dt*(1+Math.abs(speed)*.09);
  if(pt.z<ZN){pt.z=ZM;pt.x=rand(-1.2,1.2);pt.y=rand(-1.2,1.2);
   pt.g=Math.random()*24|0;pt.rot=rand(0,TAU);pt.pz=ZM;}
 }
 const sp=clamp(Math.abs(speed),0,8);
 for(const st of VOID.streams){
  st.r-=(.08+st.sp*.14)*sp*dt*(1+VOID.pulse*1.7);
  if(st.r<.04)st.r=rand(1.0,1.32);
 }
 VOID.pulseT-=dt;
 if(VOID.pulseT<=0){VOID.pulseT=rand(1.1,2.1);VOID.pulse=1;}
 VOID.pulse=Math.max(0,VOID.pulse-dt*2.1);
 VOID.ringT-=dt;
 if(VOID.ringT<=0){VOID.ringT=rand(.95,1.4);VOID.rings.push({r:.05,a:.5});}
 for(let i=VOID.rings.length-1;i>=0;i--){
  const rg=VOID.rings[i];rg.r+=dt*.5;rg.a-=dt*.28;
  if(rg.a<=.01)VOID.rings.splice(i,1);
 }
 VOID.glitchT-=dt;
 if(VOID.glitchNext>0)VOID.glitchNext-=dt;
 if(VOID.glitchNext<=0&&VOID.glitchT<=0){
  VOID.glitchT=rand(.08,.2);
  VOID.glitchNext=rand(.6,1.7)*(p>.7?.55:1);
  FLASH=Math.max(FLASH,.22);
 }
 if(VOID.lastP<.30&&p>=.30)SHAKE=Math.max(SHAKE,7);
 if(VOID.lastP<.90&&p>=.90){SHAKE=Math.max(SHAKE,21);FLASH=Math.max(FLASH,.8);}
 VOID.lastP=p;
}
/* 汇聚星流：符号沿螺旋轨道滑入奇点 */
function voidStreams(c,t,veil,opt){
 if(veil<=.03)return;

 const cx=opt.cx,cy=opt.cy,mm=opt.mm,R=mm*.50;
 c.save();c.globalCompositeOperation="lighter";
 for(const st of VOID.streams){
  const r=st.r;
  const a=st.a+t*.10+(1.25-r)*.85;
  const x=cx+Math.cos(a)*r*R,y=cy+Math.sin(a)*r*R*.92;
  const sz=5.5+14*(1.25-r);
  const al=veil*(.15+.5*(1.25-r))*(.6+.4*Math.sin(t*3.1+st.ph));

/* 黑洞奇点：光冕 + 吸积环 + 亮缘（事件视界）+ 暗核 + 脉冲波 */
function voidCore(c,t,veil,opt){
 const p=opt.p,cx=opt.cx,cy=opt.cy,mm=opt.mm;
 const grow=easeOut(clamp((p-.05)/.30,0,1));
 if(grow<=.01)return;
 const R=mm*.082*grow;
 const pulse=1+.05*Math.sin(t*3.2)+.028*Math.sin(t*8.1);
 const br=R*pulse;
 c.save();
 c.globalCompositeOperation="lighter";
 /* ① 光冕（大范围柔光） */
 const halo=c.createRadialGradient(cx,cy,br*.3,cx,cy,br*9);
 halo.addColorStop(0,"rgba(233,213,255,.60)");
 halo.addColorStop(.18,"rgba(167,139,250,.34)");
 halo.addColorStop(.45,"rgba(124,58,237,.14)");
 halo.addColorStop(.75,"rgba(76,29,149,.05)");
 halo.addColorStop(1,"rgba(0,0,0,0)");
 c.globalAlpha=veil;c.fillStyle=halo;
 c.beginPath();c.arc(cx,cy,br*8,0,TAU);c.fill();
 /* ② 吸积环 ×2（透视椭圆 / 反向自转） */
 for(let i=0;i<2;i++){
  const rr=br*(2.3+i*1.6),tilt=.30+i*.10;
  const rot=t*(.30+i*.22)*(i?-1:1);
  c.save();c.translate(cx,cy);
  c.globalAlpha=veil*(.55-i*.16);
  c.strokeStyle=i?"#a78bfa":"#ddd6fe";c.lineWidth=Math.max(1,R*.022);
  c.setLineDash([2.5,13]);c.lineDashOffset=(i?-1:1)*t*46;
  c.beginPath();c.ellipse(0,0,rr,rr*tilt,rot,0,TAU);c.stroke();
  c.restore();
 }
 c.setLineDash([]);
 /* ③ 亮缘（事件视界光圈） */
 c.globalAlpha=clamp(veil*.34,0,1);c.strokeStyle="#a78bfa";c.lineWidth=Math.max(2.5,R*.16);
 c.beginPath();c.arc(cx,cy,br*1.06,0,TAU);c.stroke();
 c.globalAlpha=clamp(veil*.92,0,1);c.strokeStyle="#ffffff";c.lineWidth=Math.max(1.2,R*.05);
 c.beginPath();c.arc(cx,cy,br*1.05,0,TAU);c.stroke();
 c.globalAlpha=clamp(veil*.5,0,1);c.strokeStyle="#ddd6fe";c.lineWidth=Math.max(.9,R*.022);
 c.beginPath();c.arc(cx,cy,br*1.32,0,TAU);c.stroke();
 c.globalAlpha=clamp(veil*.22,0,1);c.lineWidth=Math.max(.7,R*.012);
 c.beginPath();c.arc(cx,cy,br*1.66,0,TAU);c.stroke();
 /* ④ 脉冲波 */
 for(const rg of VOID.rings){
  const rr=br*.6+rg.r*mm*.5;
  c.globalAlpha=clamp(veil*rg.a*.68,0,1);
  c.strokeStyle="#c4b5fd";c.lineWidth=1.6;
  c.beginPath();c.arc(cx,cy,rr,0,TAU);c.stroke();
  c.globalAlpha=clamp(veil*rg.a*.28,0,1);
  c.lineWidth=1;
  c.beginPath();c.arc(cx,cy,rr*.955,0,TAU);c.stroke();
 }
 /* ⑤ 暗核（吞噬一切） */
 c.globalCompositeOperation="source-over";
 c.globalAlpha=clamp(veil*.96,0,1);c.fillStyle="#020109";
 c.beginPath();c.arc(cx,cy,br*.96,0,TAU);c.fill();
 /* ⑤.5 环缘雾光（贴在事件视界外的辉光层） */
 c.globalCompositeOperation="lighter";
 const atm=c.createRadialGradient(cx,cy,br*.78,cx,cy,br*2.8);
 atm.addColorStop(0,"rgba(196,181,253,0)");
 atm.addColorStop(.16,"rgba(196,181,253,.36)");
 atm.addColorStop(.5,"rgba(124,58,237,.11)");
 atm.addColorStop(1,"rgba(0,0,0,0)");
 c.globalAlpha=veil;c.fillStyle=atm;
 c.beginPath();c.arc(cx,cy,br*2.8,0,TAU);c.fill();
 /* ⑥ 核内裂隙弧光 */
 c.globalCompositeOperation="lighter";
 for(let i=0;i<3;i++){
  const a0=t*(.5+i*.37)+i*2.3,sw=2.2+.9*Math.sin(t*(1.1+i*.3)+i);
  c.globalAlpha=clamp(veil*(.75-i*.16),0,1);
  c.strokeStyle=i?"#c4b5fd":"#ffffff";c.lineWidth=1.05;
  c.beginPath();c.arc(cx,cy,br*(.5+i*.22),a0,a0+sw);c.stroke();
 }
 /* ⑦ 中心热斑 */
 const cp=c.createRadialGradient(cx,cy,0,cx,cy,br*.72);
 cp.addColorStop(0,"rgba(255,255,255,.95)");
 cp.addColorStop(.4,"rgba(233,213,255,.38)");
 cp.addColorStop(1,"rgba(0,0,0,0)");
 c.globalAlpha=clamp(veil*.95,0,1);c.fillStyle=cp;
 c.beginPath();c.arc(cx,cy,br*.72,0,TAU);c.fill();
 c.restore();
}
/* 信息过载故障：横向切片错位（自绘读回 + 扫描线） */
function voidGlitch(c,strength){

 c.setTransform(DPR,0,0,DPR,0,0);
 const n=2+Math.floor(strength*13);
 for(let i=0;i<n;i++){

 for(let i=0;i<2;i++)c.fillRect(0,rand(0,H),W,rand(1,2.8));

/* 符号场绘制：alpha 全局强度 · t 时间 · overload 过载增益 · streak 拖尾强度 */
function voidDraw(c,alpha,t,overload,streak){
 const S=VOID.sheet;if(!S||alpha<=.01)return;
 const cx=W/2,cy=H/2,SP=Math.max(W,H)*.66;
 c.save();c.globalCompositeOperation="lighter";
 for(const pt of VOID.parts){
  const depth=(pt.z-VOID.ZMIN)/(VOID.ZMAX-VOID.ZMIN);
  const s=.62/(pt.z*.62+.26);
  const dx=cx+pt.x*s*SP,dy=cy+pt.y*s*SP;
  if(dx<-90||dx>W+90||dy<-90||dy>H+90)continue;
  const sz=(12+52*(1-depth));
  const near=clamp((pt.z-VOID.ZMIN)/(VOID.ZMIN*.85),0,1);
  let a=alpha*(.20+.80*(1-depth))*near*(overload||1);
  a*=.72+.28*Math.sin(t*pt.tw+pt.ph);
  if(pt.fl&&Math.sin(t*13+pt.ph)>.86)a*=2.1;
  if(a<=.012)continue;
  if(streak>.02){
   const pz2=Math.max(pt.pz,VOID.ZMIN+.001);
   const sP=.62/(pz2*.62+.26);
   const x2=cx+pt.x*sP*SP,y2=cy+pt.y*sP*SP;
   c.globalAlpha=clamp(a*streak*.55,0,1);
   c.strokeStyle="#c4b5fd";c.lineWidth=Math.max(.7,sz*.09);
   c.beginPath();c.moveTo(x2,y2);c.lineTo(dx,dy);c.stroke();
  }
  c.globalAlpha=clamp(a,0,1);
  const gx=(pt.g%S.cols)*S.cell,gy=Math.floor(pt.g/S.cols)*S.cell;
  c.save();c.translate(dx,dy);c.rotate(pt.rot);
  c.drawImage(S.cv,gx,gy,S.cell,S.cell,-sz/2,-sz/2,sz,sz);
  c.restore();
 }
 c.restore();
}
/* 无量空处主绘制：展开光环 → 无限环 → 符号雨 → 星流 → 奇点 → 故障 → 白闪 */
function drawVoidDomain(c,d){
 const p=clamp(d.t/d.dur,0,1),t=d.t;
 const cx=W/2,cy=H/2,mm=Math.min(W,H),MM=Math.max(W,H);
 const inP=clamp(p/.11,0,1),outP=p>.90?clamp((p-.90)/.10,0,1):0;
 const veil=Math.min(inP,1-outP);
 const opt={p,cx,cy,mm};
 /* ① 黑幕 + 深处紫辉 */
 c.save();
 c.globalAlpha=veil*.96;c.fillStyle="#04030a";c.fillRect(0,0,W,H);
 if(veil>.02){
  c.globalCompositeOperation="lighter";c.globalAlpha=veil*.5;
  const bg=c.createRadialGradient(cx,cy,0,cx,cy,MM*.80);
  bg.addColorStop(0,"rgba(124,58,237,.34)");
  bg.addColorStop(.42,"rgba(76,29,149,.13)");
  bg.addColorStop(1,"rgba(0,0,0,0)");
  c.fillStyle=bg;c.fillRect(0,0,W,H);
 }
 c.restore();
 /* ② 展开瞬间：屏障光环 + 巨型星纹 */
 if(p<.20){
  const k=easeOut(clamp(p/.20,0,1));
  const rr=mm*(.12+.98*k);
  c.save();c.globalCompositeOperation="lighter";
  c.globalAlpha=clamp(veil*(1-k)*.55,0,1);
  c.strokeStyle="#e9d5ff";c.lineWidth=2.4;
  c.beginPath();c.arc(cx,cy,rr,0,TAU);c.stroke();
  c.globalAlpha=clamp(veil*(1-k)*.3,0,1);
  c.beginPath();c.arc(cx,cy,rr*.92,0,TAU);c.stroke();
  const im=layer("hex","mix",260,36,23);
  c.translate(cx,cy);c.rotate(k*1.4);
  c.globalAlpha=clamp(veil*(1-k)*.7,0,1);
  c.drawImage(im,-rr,-rr,rr*2,rr*2);
  c.rotate(-k*2.2);
  c.globalAlpha=clamp(veil*(1-k)*.4,0,1);
  c.drawImage(im,-rr*.72,-rr*.72,rr*1.44,rr*1.44);
  c.restore();
 }
 /* ③ 无限环（超大法阵呼吸层） */
 if(veil>.05&&p>.14){
  const eR=MM*.72;
  c.save();c.globalCompositeOperation="lighter";
  for(let i=0;i<3;i++){
   const br2=1+.05*Math.sin(t*(.5+i*.27)+i*1.7);
   const a2=t*(.24+i*.17)*(i%2?-1:1);
   c.globalAlpha=clamp(veil*(.15-i*.032)*(.7+.3*Math.sin(t*.8+i)),0,1);
   const im=layer(i===0?"ring":(i===1?"hex":"glyph"),d.scheme,eR*.5,36,i*17+5);
   c.save();c.translate(cx,cy);c.rotate(a2);c.scale(br2,br2);
   c.drawImage(im,-eR,-eR,eR*2,eR*2);c.restore();
  }
  c.restore();
 }
 /* ④ 符号雨（自转 + 拖尾 + 近景淡出） */
 const vspd=voidSpeedOf(p);
 const streak=clamp((Math.abs(vspd)-1.7)/5.5,0,1);
 const overload=1+(VOID.glitchT>0?.85:0)+VOID.pulse*.45;
 voidDraw(c,veil*clamp(p/.16,0,1),t,overload,streak);
 /* ⑤ 汇聚星流 */
 voidStreams(c,t,veil*clamp((p-.05)/.15,0,1),opt);
 /* ⑥ 奇点 */
 voidCore(c,t,veil,opt);
 /* ⑦ 过载故障 */
 voidGlitch(c,(VOID.glitchT>0&&veil>.3)?Math.min(1,VOID.glitchT/.16):0);
 /* ⑧ 塌缩：双环收缩 */
 if(p>.90){
  const k=clamp((p-.90)/.10,0,1);
  c.save();c.globalCompositeOperation="lighter";
  c.globalAlpha=clamp(veil*(1-k)*.5,0,1);
  c.strokeStyle="#e9d5ff";c.lineWidth=2.2;
  c.beginPath();c.arc(cx,cy,mm*(.75-.6*k),0,TAU);c.stroke();
  c.beginPath();c.arc(cx,cy,mm*(.52-.42*k),0,TAU);c.stroke();
  c.restore();
 }
 /* ⑨ 展开 / 塌缩白闪 */
 if(p<.09){c.save();c.globalAlpha=(1-p/.09)*.9;c.fillStyle="#fff";c.fillRect(0,0,W,H);c.restore();}
 const wOut=p<.955?clamp(outP/.55,0,1):clamp((1-p)/.045,0,1);
 if(wOut>0){c.save();c.globalAlpha=wOut*.92;c.fillStyle="#fff";c.fillRect(0,0,W,H);c.restore();}
}

 ctx.translate(W/2+ox,H/2+oy);ctx.scale(ZOOM,ZOOM);ctx.translate(-W/2,-H/2);
 drawBG(ctx,T);
 if(FX.void)drawVoidDomain(ctx,FX.void);
 if(FX.domain)drawDomain(ctx,FX.domain);
 for(const p of FX.pillars)drawPillar(ctx,p);
 for(const s of FX.sigils)drawMirror(ctx,s);
 for(const s of FX.sigils)drawSigilLayers(ctx,s);
 for(const n of FX.novas)drawNova(ctx,n);
 for(const s of FX.shocks)drawShock(ctx,s);
 drawPT(ctx);
 /* 爆发色差：RGB 三通道错位叠加 */
 if(OPT.chrom&&FLASH>.02){
  ctx.globalCompositeOperation="lighter";ctx.globalAlpha=FLASH*.30;
  const off=FLASH*11;
  ctx.fillStyle="#ff2244";ctx.fillRect(-off,0,W,H);
  ctx.fillStyle="#22aaff";ctx.fillRect(off,0,W,H);
  ctx.globalAlpha=0;ctx.globalCompositeOperation="source-over";
  FLASH*=.86;
 }
 ctx.restore();
 /* 全屏闪白 */
 if(FLASH>.02){
  ctx.save();ctx.globalAlpha=FLASH*.45;ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.restore();
 }
 /* 暗角 */
 const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.32,W/2,H/2,Math.max(W,H)*.78);
 vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.62)");
 ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

/* ───────── §10 交互 ───────── */
function $(id){return document.getElementById(id);}
/* 配色色板 */
(function(){
 const box=$("swatch");
 for(const k in PALETTE){
  const b=document.createElement("div");
  b.className="s-c"+(k===CUR?" sel":"");
  b.style.background=PALETTE[k].ring;b.style.color=PALETTE[k].glow;
  b.title=PALETTE[k].name;
  b.onclick=()=>{CUR=k;box.querySelectorAll(".s-c").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");};
  box.appendChild(b);
 }
})();
function castAt(x,y){
 const R=rand(Math.min(W,H)*.10,Math.min(W,H)*.20);
 addSigil(x,y,R,{dur:rand(2,3.2),scheme:CUR,seed:Math.random()*97|0});
 emit(x,y,26,{spd0:40,spd1:180,r0:.8,r1:2.4,life0:.5,life1:1.4,k:1,c:PALETTE[CUR].star,jitter:8});
 addShock(x,y,R*.8,CUR,1.1);
 ach("sigil.cast","初施魔法","✦");
}
cv.addEventListener("pointerdown",e=>{
 seqManual=true;$("cAuto").checked=false;OPT.auto=false;
 setStage("手动施放","MANUAL");
 castAt(e.clientX,e.clientY);
});
$("bSigil").onclick=()=>{seqManual=true;$("cAuto").checked=false;OPT.auto=false;
 setStage("法阵","SIGIL");castAt(rand(W*.25,W*.75),rand(H*.4,H*.66));};
$("bDomain").onclick=()=>{seqManual=true;$("cAuto").checked=false;OPT.auto=false;
 setStage("领域展开","DOMAIN");castDomain(CUR,7);addSigil(W/2,H*.56,Math.min(W,H)*.34,{dur:6.6,seed:23,base:1});
 ach("sigil.domain","领域展开","◈");};
$("bNova").onclick=()=>{seqManual=true;$("cAuto").checked=false;OPT.auto=false;
 setStage("超位魔法","OVERRANK");addNova(W/2,H*.56,Math.min(W,H)*.22,CUR);
 ach("sigil.overrank","超位咏唱","✹");};
$("bVoid").onclick=()=>{seqManual=true;$("cAuto").checked=false;OPT.auto=false;
 setStage("无量空处","UNLIMITED VOID");castVoid(13);
 ach("sigil.void","无量空处","∞");};
addEventListener("keydown",e=>{
 if(e.code==="Space"){e.preventDefault();$("bDomain").onclick();}
 else if(e.code==="KeyE"){$("bNova").onclick();}
 else if(e.code==="KeyV"){$("bVoid").onclick();}
 else if(e.code==="KeyH"){$("ui").classList.toggle("hide");}
});
$("toggle").onclick=()=>$("ui").classList.remove("hide");
/* 参数绑定 */
[["rGlyph","vGlyph","glyphN",v=>v,v=>v],
 ["rSpin","vSpin","spin",v=>v/100,v=>v.toFixed(1)],
 ["rGlow","vGlow","glow",v=>v/100,v=>v.toFixed(1)],
 ["rDust","vDust","dust",v=>v,v=>v]].forEach(([rid,vid,key,conv,fmt2])=>{
 const r=$(rid),v=$(vid);
 r.oninput=()=>{const raw=+r.value;OPT[key]=conv(raw);v.textContent=fmt2(OPT[key]);};
 v.textContent=fmt2(OPT[key]);
});
["cAuto","cMirror","cChrom","cShake","cBloom"].forEach(id=>{
 const el=$(id),key=id.slice(1).replace("Auto","auto").replace("Mirror","mirror")
   .replace("Chrom","chrom").replace("Shake","shake").replace("Bloom","bloom");
 el.onchange=()=>{OPT[key]=el.checked;
  if(key==="auto"&&el.checked){seqManual=false;seqI=0;seqT=0;
   setStage(SEQ[0].n,SEQ[0].s);}};
});

/* 启动 */
setStage(SEQ[0].n,SEQ[0].s);
addSigil(W/2,H*.56,Math.min(W,H)*.26,{dur:3.6,seed:7,base:.9});
requestAnimationFrame(frame);
window.__SIGIL={PALETTE,OPT,FX,PT,CACHE,VOID,addSigil,addNova,castDomain,castVoid,layer,starPaths};
</script>
