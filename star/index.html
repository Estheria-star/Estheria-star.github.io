<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="无限星空生成器：输入种子编号生成一片独一无二的星空，往任何方向拖动都无限延伸；可缩放探索、下载做壁纸，种子+视角可分享。startian.top 出品">
<meta name="theme-color" content="#070b18">
<title>无限星空生成器 · 种子生成 · startian.top</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#070b18}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  canvas.dragging{cursor:grabbing}
  .bar{
    position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:5;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
    background:rgba(10,16,34,.62);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
    border:1px solid rgba(120,150,255,.22);border-radius:999px;padding:10px 14px;
    box-shadow:0 16px 44px rgba(0,0,0,.5);
  }
  .seed{
    font-family:ui-monospace,Consolas,monospace;font-size:13px;font-weight:700;color:#cdd8ff;
    letter-spacing:.6px;padding:0 6px;white-space:nowrap;
  }
  .seed b{color:#8fd0ff;cursor:pointer;border-bottom:1px dashed rgba(143,208,255,.45);padding-bottom:1px;transition:color .2s}
  .seed b:hover{color:#c9e6ff}
  .seed input{width:74px;background:rgba(6,10,22,.9);border:1px solid rgba(130,160,255,.55);border-radius:8px;color:#8fd0ff;font:inherit;font-weight:700;padding:2px 6px;outline:none;text-align:center}
  button{
    border:1px solid rgba(130,160,255,.35);border-radius:999px;padding:9px 16px;
    font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;color:#e8eeff;
    background:linear-gradient(180deg,rgba(90,130,255,.32),rgba(60,90,200,.28));
    transition:transform .15s ease,border-color .2s ease,box-shadow .2s ease;white-space:nowrap;
  }
  button:hover{border-color:rgba(160,190,255,.7);transform:translateY(-1px);box-shadow:0 8px 22px rgba(70,110,255,.25)}
  button:active{transform:translateY(1px)}
  button.primary{
    background:linear-gradient(180deg,#6d8dff,#4262d8);color:#fff;border-color:transparent;
    box-shadow:0 6px 0 #2a3d8f,0 14px 28px rgba(70,110,255,.4);
  }
  button.primary:active{box-shadow:0 2px 0 #2a3d8f}
  .home{
    position:fixed;left:16px;bottom:16px;z-index:5;text-decoration:none;font-size:12.5px;font-weight:700;
    color:#bcd0ff;background:rgba(12,18,38,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1px solid rgba(120,150,255,.25);border-radius:999px;padding:10px 16px;
    transition:border-color .2s ease,transform .2s ease;
  }
  .home:hover{border-color:rgba(160,190,255,.6);transform:translateY(-2px)}
  .hint{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:4;
    font-size:11.5px;color:rgba(180,196,240,.6);white-space:nowrap;pointer-events:none;
  }
  .zoom{
    position:fixed;right:16px;bottom:62px;z-index:5;display:flex;flex-direction:column;gap:8px;
  }
  .zoom button{width:42px;height:42px;padding:0;font-size:17px;border-radius:14px;display:grid;place-items:center}
  .toast{
    position:fixed;left:50%;top:78px;transform:translateX(-50%) translateY(-8px);opacity:0;z-index:6;
    background:rgba(14,22,46,.9);border:1px solid rgba(130,160,255,.35);border-radius:999px;
    padding:9px 18px;font-size:12.5px;font-weight:700;color:#e8eeff;
    transition:opacity .3s ease,transform .3s ease;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%)}
  @media (max-width:680px){
    .bar{top:12px;left:12px;right:12px;transform:none;border-radius:20px;padding:10px}
    .hint{display:none}
  }
</style>
</head>

<canvas id="sky"></canvas>
<div class="bar">
  <span class="seed">星空 <b id="seedNo">#0000</b></span>
  <button class="primary" id="btnNew" type="button">✨ 生成新星空</button>
  <button id="btnWall" type="button">⬇ 下载壁纸</button>
  <button id="btnShare" type="button">🔗 分享这颗</button>

<div class="zoom">
  <button id="btnIn" type="button" title="放大">＋</button>
  <button id="btnOut" type="button" title="缩小">－</button>
  <button id="btnHome" type="button" title="回到原点">⌖</button>

            g.fillStyle = 'rgba(8,12,28,.99)';

            var cyw = (-v.y / (W2 / window.innerWidth)) / s + (H2 / (W2 / window.innerWidth)) / 2;
            var dw = Math.hypot(cxw - (-10011), cyw - 2845);

  function displaySeed() { document.getElementById('seedNo').textContent = '#' + String(curSeed).padStart(4, '0'); }

    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2400);
  }

  document.getElementById('btnNew').addEventListener('click', function () {
    newSky();
    toast('✨ 星空 #' + String(curSeed).padStart(4, '0'));
  });

  /* —— 点星空编号就地改种子（也能输入别人分享的编号） —— */
  (function () {
    var el = document.getElementById('seedNo');
    el.title = '点一下，输入星空编号';
    el.addEventListener('click', function () {
      if (el.querySelector('input')) return;
      var inp = document.createElement('input');
      inp.value = String(curSeed);
      inp.maxLength = 5;
      inp.setAttribute('inputmode', 'numeric');
      el.textContent = '';
      el.appendChild(inp);
      inp.focus(); inp.select();
      var done = false;
      function finish(apply) {
        if (done) return;
        done = true;
        var v = apply ? parseInt(inp.value, 10) : NaN;
        if (isFinite(v) && v > 0) {
          curSeed = v % 100000;
          view.x = 0; view.y = 0; view.s = 1;
          clearChunks();
          refreshPalette();
          displaySeed();
          fit();
          saveUrl();
          toast('✨ 星空 #' + String(curSeed).padStart(4, '0') + ' 已就位');
        } else {
          displaySeed();
        }
      }
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') finish(true);
        else if (e.key === 'Escape') finish(false);
        e.stopPropagation();
      });
      inp.addEventListener('blur', function () { finish(true); });
      inp.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    });
  })();

  document.getElementById('btnWall').addEventListener('click', function () {
    var w = 1920, h = 1080;
    var off = document.createElement('canvas');
    off.width = w; off.height = h;
    /* 壁纸按当前视角等比映射（含平移与缩放） */
    var sx = w / W, sy = h / H;
    render(off.getContext('2d'), w, h, curSeed, { x: view.x * sx, y: view.y * sy, s: view.s * sx });
    off.toBlob(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'starfield-' + String(curSeed).padStart(4, '0') + '-1920x1080.png';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      toast('⬇️ 壁纸已下载（1920×1080，含当前视角）');
      try { STAch.unlock('star.wall', '把星空带回家', '🖼️'); } catch (e) {}
    }, 'image/png');
  });

  document.getElementById('btnShare').addEventListener('click', function () {
    var need = (view.s !== 1 || view.x || view.y);
    var url = location.origin + location.pathname + '?seed=' + curSeed +
      (need ? '&v=' + Math.round(view.x) + ',' + Math.round(view.y) + ',' + view.s.toFixed(3) : '');
    if (location.protocol === 'file:') url = '（部署后可用）' + url;
    function done() { toast('🔗 链接已复制：我的星空 #' + String(curSeed).padStart(4, '0') + '（含视角）'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, fallback);
    } else fallback();
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = url;
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('我的星空 #' + String(curSeed).padStart(4, '0')); }
      document.body.removeChild(ta);
    }
  });

  window.addEventListener('resize', fit);

  /* 测试钩子（供自动化验收；不影响页面功能） */
  window.__sky = {
    seed: function () { return curSeed; },
    setSeed: function (n) { newSky(n); },
    view: view,
    chunk: function (cx, cy) { return JSON.stringify(getChunk(curSeed, cx, cy)); },
    chunkCount: function () { return Object.keys(chunkCache).length; },
    clearChunks: clearChunks,
    stats: function () { return { chunks: lastStats.chunks, drawn: lastStats.drawn, ms: +lastStats.ms.toFixed(2) }; },
    size: function () { return { W: W, H: H, dpr: dpr }; },
    pan: function (dx, dy) { view.x += dx; view.y += dy; draw(); return { x: view.x, y: view.y }; },
    zoom: function (f) { applyScale(Math.max(MIN_S, Math.min(MAX_S, view.s * f)), W / 2, H / 2); draw(); return view.s; },
    /* —— 平滑缩放（v4）测试钩子 —— */
    zoomBy: function (f) { zoomBy(f); return { s: +view.s.toFixed(5), target: +zt.s.toFixed(5), active: zt.active }; },
    wheel: function (dy, px, py, mode) {
      wheelZoom({ deltaY: dy, deltaMode: mode || 0, clientX: px == null ? W / 2 : px, clientY: py == null ? H / 2 : py });
      return { s: +view.s.toFixed(5), target: +zt.s.toFixed(5), active: zt.active };
    },
    stepZoom: function (ms, steps) {
      var n = steps || Math.max(1, Math.round(ms / 16.7));
      for (var i = 0; i < n; i++) stepZoom((ms / 1000) / n);
      return { s: +view.s.toFixed(5), target: +zt.s.toFixed(5), active: zt.active };
    },
    zoomState: function () { return { s: +view.s.toFixed(5), target: +zt.s.toFixed(5), active: zt.active }; },
    worldAt: function (sx, sy) { return { x: (sx - W / 2 - view.x) / view.s + W / 2, y: (sy - H / 2 - view.y) / view.s + H / 2 }; },
    /* 时间轴控制（测试用）：固定/读取全局时钟 */
    setTime: function (t) { T = t; return T; },
    time: function () { return +T.toFixed(3); },
    setParallax: function (x, y) { par.x = x; par.y = y; return par; },
    /* 同步渲染一帧并返回耗时（测试专用：hidden 页面 rAF 冻结时用） */
    renderNow: function () {
      render(ctx, cv.width, cv.height, curSeed, { x: view.x * dpr, y: view.y * dpr, s: view.s });
      return { ms: +lastStats.ms.toFixed(2), chunks: lastStats.chunks, drawn: lastStats.drawn };
    }
  };

  /* 初始化：URL（seed + 视角） */
  var q = new URLSearchParams(location.search);
  var s = parseInt(q.get('seed') || '', 10);
  curSeed = isFinite(s) && s > 0 ? (s % 100000) : (Math.floor(Math.random() * 9999) + 1);
  refreshPalette();   /* 按最终种子派生调色板（须在首次渲染前） */
  var vq = (q.get('v') || '').split(',').map(parseFloat);
  if (vq.length === 3 && vq.every(isFinite)) {
    view.x = vq[0]; view.y = vq[1]; view.s = Math.max(MIN_S, Math.min(MAX_S, vq[2]));
  }
  displaySeed();
  fit();
  if (isFinite(s) && s > 0) toast('复活了星空 #' + String(curSeed).padStart(4, '0'));
})();
</script>

<script>
/* ============================================================
   🔮 ARG · 精简进度机（星空站）2026-10-03
   与主页共用 st_arg（cookie .startian.top + localStorage 兜底）
   ============================================================ */
(function () {
  'use strict';
  var KEY = 'st_arg';
  if (window.ARG && window.ARG.collect) return;   /* 主页已注入时复用 */
  function readState() {
    var raw = null;
    try { var m = document.cookie.match(/(?:^|;\s*)st_arg=([^;]*)/); if (m) raw = decodeURIComponent(m[1]); } catch (e) {}
    if (!raw) { try { raw = localStorage.getItem(KEY); } catch (e) {} }
    try { var d = JSON.parse(raw || '{}'); if (!d || typeof d !== 'object') d = {}; if (!Array.isArray(d.logs)) d.logs = []; return d; }
    catch (e) { return { logs: [] }; }
  }
  var state = readState();
  function save() {
    var raw = JSON.stringify(state);
    try { localStorage.setItem(KEY, raw); } catch (e) {}
    try {
      var v = encodeURIComponent(raw);
      if (v.length < 3800) document.cookie = 'st_arg=' + v + ';domain=.startian.top;path=/;max-age=31536000;SameSite=Lax';
    } catch (e) {}
  }
  var toastTimer = 0;
  window.ARG = {
    has: function (id) { return state.logs.indexOf(id) >= 0; },
    count: function () { return state.logs.length; },
    collect: function (id) {
      if (state.logs.indexOf(id) >= 0) return false;
      state.logs.push(id); save();
      this.toast('📜 找到一篇日志（去主页头像连点 7 下看全文）');
      return true;
    },
    reset: function () { state = { logs: [] }; save(); },
    toast: function (msg) {
      try {
        var el = document.getElementById('__arg_toast');
        if (!el) {
          el = document.createElement('div');
          el.id = '__arg_toast';
          el.style.cssText = 'position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(16px);opacity:0;z-index:9994;background:rgba(12,17,32,.96);color:#eef4ff;border:1px solid rgba(198,214,240,.4);border-radius:999px;padding:12px 24px;font:700 13px/1.5 system-ui,sans-serif;box-shadow:0 18px 44px rgba(0,0,0,.5);transition:all .45s cubic-bezier(.2,.85,.3,1.1);pointer-events:none;max-width:88vw;text-align:center';
          document.body.appendChild(el);
        }
        el.textContent = msg;
        requestAnimationFrame(function () { el.style.opacity = '1'; el.style.transform = 'translateX(-50%)'; });
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.style.opacity = '0'; el.style.transform = 'translateX(-50%) translateY(16px)'; }, 3000);
      } catch (e) {}
    }
  };
})();
</script></body>
