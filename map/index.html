<meta charset="UTF-8">

<meta name="description" content="星恬的宇宙地图：14 颗作品星在宇宙里自由漂浮，彼此靠近时自动连线；去过的会亮起来，点击星星可展开「星图关系视图」。startian.top 全站导航">

<title>宇宙地图 · startian.top</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:radial-gradient(1200px 700px at 50% -180px,#141b38 0%,#0a0f24 45%,#05070f 100%);
    background-attachment:fixed;
    color:#e8eeff;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      radial-gradient(1.2px 1.2px at 24px 32px, rgba(255,255,255,.55), transparent),
      radial-gradient(1px 1px at 86px 128px, rgba(190,214,255,.42), transparent),
      radial-gradient(1.6px 1.6px at 66px 168px, rgba(255,255,255,.32), transparent),
      radial-gradient(1px 1px at 244px 188px, rgba(170,196,255,.45), transparent),
      radial-gradient(1.3px 1.3px at 300px 100px, rgba(255,255,255,.28), transparent);
    background-size:340px 260px;
  }
  .neb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
  .neb.a{width:430px;height:430px;left:-130px;top:-90px;background:radial-gradient(circle,#6d28d9,transparent 70%);opacity:.3}
  .neb.b{width:470px;height:470px;right:-150px;top:110px;background:radial-gradient(circle,#0e7490,transparent 70%);opacity:.26}
  .neb.c{width:400px;height:400px;left:32%;bottom:-180px;background:radial-gradient(circle,#b45309,transparent 70%);opacity:.16}

  .wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:26px 20px 90px}

  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .hd-eyebrow{font-size:11px;letter-spacing:4px;font-weight:800;color:#7f8fc0;margin-bottom:5px}
  h1{font-size:23px;margin:0 0 3px;letter-spacing:.5px}
  .sub{font-size:12.5px;color:#8fa0c8;font-weight:600}
  .hright{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .prog{display:flex;flex-direction:column;gap:5px;min-width:150px}
  .prog .t{font-size:12.5px;font-weight:700;color:#b9c6e8}
  .prog .t b{color:#ffd97a;font-size:14px}
  .prog .bar{height:7px;border-radius:999px;background:rgba(20,28,54,.9);border:1px solid rgba(120,150,220,.25);overflow:hidden}
  .prog .bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#8b5cf6,#38bdf8,#fbbf24);transition:width .7s cubic-bezier(.25,.9,.3,1)}
  .home{text-decoration:none;font-size:12.5px;font-weight:700;color:#cfe0ff;border:1px solid rgba(130,160,230,.3);border-radius:999px;padding:9px 16px;background:rgba(16,24,48,.7);transition:border-color .2s,transform .2s;white-space:nowrap}
  .home:hover{border-color:rgba(160,190,255,.7);transform:translateY(-1px)}

  .banner{display:none;margin-bottom:14px;padding:13px 20px;border-radius:16px;font-size:14px;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(100deg,rgba(139,92,246,.22),rgba(56,189,248,.2),rgba(251,191,36,.2));
    border:1px solid rgba(180,200,255,.35);box-shadow:0 0 34px rgba(120,140,255,.25);animation:bannerGlow 2.6s ease-in-out infinite}
  .banner.show{display:block}
  @keyframes bannerGlow{0%,100%{box-shadow:0 0 26px rgba(120,140,255,.22)}50%{box-shadow:0 0 44px rgba(160,180,255,.42)}}

  .stage{position:relative;border:1px solid rgba(110,140,220,.22);border-radius:26px;overflow:hidden;
    background:radial-gradient(900px 520px at 50% 0%,rgba(30,40,80,.55),rgba(10,15,34,.65));
    box-shadow:0 30px 80px rgba(0,0,0,.5), inset 0 0 60px rgba(60,80,160,.12)}
  #mapSvg{display:block;width:100%;height:auto}

  /* ============================================================
     ✦ 星星：光晕 / 星芒 / 呼吸光环 / 渐变核心（由运动系统实时驱动位置）
     ============================================================ */
  .node{cursor:pointer;text-decoration:none;transition:opacity .55s ease}
  .node .pos{will-change:transform}
  .node .fx{transition:transform .3s cubic-bezier(.3,1.35,.5,1);transform-box:fill-box;transform-origin:center}
  .node:hover .fx{transform:scale(1.14)}
  .node .core{transition:filter .3s ease}
  .node .halo,.node .spike,.node .glow{transform-box:fill-box;transform-origin:center}
  .node .label{font-size:15px;font-weight:800;fill:#7a86a8;letter-spacing:1px;text-anchor:middle;transition:fill .25s ease,font-size .4s ease;pointer-events:none}
  .node .ico{font-size:16px;text-anchor:middle;dominant-baseline:central;pointer-events:none;transition:opacity .3s ease}
  .node .hit{fill:transparent}

  /* —— 未点亮：哑光暗星（不发光）—— */
  .node:not(.lit) .core{fill:#151b33;stroke:rgba(122,140,200,.4);stroke-width:1.3}
  .node:not(.lit) .ring{fill:none;stroke:rgba(110,130,190,.32);stroke-width:1;stroke-dasharray:4 6}
  .node:not(.lit) .ico{opacity:.34;filter:grayscale(1) brightness(.9)}
  .node:not(.lit):hover .core{stroke:rgba(170,190,255,.8);fill:#1b2240}
  .node:not(.lit):hover .label{fill:#c6d2f0}

  /* —— 点亮：发光星球 —— */
  .node.lit .glow{opacity:.9;animation:glowPulse 3.4s ease-in-out infinite;animation-delay:var(--dl,0s)}
  .node.lit .core{fill:url(#coreGrad);stroke:none}
  .node.lit .halo{fill:none;stroke:var(--c);stroke-width:1.5;opacity:.8;animation:breathe 3.2s ease-in-out infinite;animation-delay:var(--dl,0s)}
  .node.lit .spike{fill:var(--c);opacity:.75;animation:spikePulse 3.2s ease-in-out infinite;animation-delay:var(--dl,0s)}
  .node.lit .label{fill:#eef4ff;text-shadow:0 0 12px rgba(140,170,255,.6)}
  .node.lit:hover .halo{stroke-width:2.3}
  @keyframes breathe{0%,100%{opacity:.38;transform:scale(.93)}50%{opacity:1;transform:scale(1.06)}}
  @keyframes glowPulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes spikePulse{0%,100%{opacity:.5;transform:scale(.88)}50%{opacity:.95;transform:scale(1.08)}}

  /* —— 悬停冻结中的星：给个柔和的"凝住"微光提示 —— */
  .node.frozenStar .halo{stroke-dasharray:3 5;animation-play-state:paused}
  .node.frozenStar .glow{animation-play-state:paused}
  .node.frozenStar .spike{animation-play-state:paused}

  /* —— 跃迁 / 闪烁 —— */
  .node.jump .fx{animation:jumpFlash .55s ease;transform-box:fill-box;transform-origin:center}
  @keyframes jumpFlash{0%{transform:scale(1)}42%{transform:scale(1.45);filter:brightness(2.2)}100%{transform:scale(1)}}
  .node.jump .halo{opacity:1;stroke-width:3.2}

  /* ============================================================
     ✦ 动态连接线（78 对，实时演算：靠近显现 / 远离消失）
     ============================================================ */
  #dynLinks{transition:opacity .45s ease}
  .rel-mode #dynLinks{opacity:0}
  .dlink .dbase{fill:none;stroke-width:1.5}
  .dlink .dflow{fill:none;stroke-width:1.9;stroke-linecap:round;stroke-dasharray:3 15;animation:flowdash 1.6s linear infinite}
  @keyframes flowdash{to{stroke-dashoffset:-18}}

  /* 星域光斑与标签 */
  .zoneGlowText{text-anchor:middle;pointer-events:none;transition:opacity .5s ease}
  .zname{font-size:20px;font-weight:900;fill:#dfe8ff;letter-spacing:2px}
  .zsub{font-size:12px;font-weight:700;fill:#8697c4;letter-spacing:1px}
  .zoneBlob{transition:opacity .6s ease}
  .watermark{font-size:15px;font-weight:800;fill:rgba(150,170,230,.14);letter-spacing:6px;text-anchor:middle;pointer-events:none;transition:opacity .5s ease}
  #relLinks{opacity:0;pointer-events:none;transition:opacity .55s ease}
  .rel-mode #relLinks{opacity:1;transition-delay:.45s}
  .rel-mode .zoneGlowText,.rel-mode .watermark,.rel-mode .zoneBlob{opacity:0}
  .rel-lab{font-size:11px;font-weight:700;fill:rgba(255,222,150,.85);text-anchor:middle;letter-spacing:1px}
  .rel-link{fill:none;stroke:rgba(255,214,130,.55);stroke-width:1.6}
  .rel-link-g{animation:relFadeIn .5s ease both}
  @keyframes relFadeIn{from{opacity:0}}
  .rel-link .rl-flow{fill:none;stroke:#ffd97a;stroke-width:2;stroke-dasharray:2.5 14;animation:flowdash 1.5s linear infinite;stroke-linecap:round}
  .rel-node-halo{fill:none;stroke:rgba(255,214,130,.5);stroke-width:1.4;stroke-dasharray:3 6;animation:haloSpin 14s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes haloSpin{to{transform:rotate(360deg)}}

  /* —— 关系模式下的节点状态 —— */
  .node.faded{opacity:.13}
  .node.faded:hover{opacity:.55}
  .node.faded .fx{transform:scale(.55)}
  .node.faded:hover .fx{transform:scale(.8)}
  .node.center .fx{transform:scale(1.5)}
  .node.center:hover .fx{transform:scale(1.58)}
  .node.center .halo{stroke-width:2.6;opacity:1}
  .node.center .spike{opacity:1;animation-duration:2.2s}
  .node.center .label{font-size:18px;fill:#fff}
  .node.center .hit{r:58px}

  /* ============================================================
     ✦ 工具行 / 关系信息卡
     ============================================================ */
  .toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:#9fb0d8}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .lg-dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:0 0 auto}
  .lg-lit{background:radial-gradient(circle at 35% 35%,#fff,#a78bfa 60%,#38bdf8);box-shadow:0 0 10px rgba(139,92,246,.9)}
  .lg-dim{background:#151b33;border:1.4px dashed rgba(120,140,200,.5)}
  .lg-line{width:22px;height:0;border-top:2px dashed rgba(140,170,255,.6);display:inline-block}
  button.rand{
    margin-left:auto;border:1px solid rgba(140,170,255,.4);border-radius:999px;padding:11px 20px;font-family:inherit;cursor:pointer;
    font-size:13.5px;font-weight:800;color:#0a0f24;background:linear-gradient(100deg,#ffd97a,#fbbf24);
    box-shadow:0 6px 0 #8a6a1a,0 14px 30px rgba(251,191,36,.25);transition:transform .15s ease;
  }
  button.rand:active{transform:translateY(2px);box-shadow:0 3px 0 #8a6a1a}
  .tipnote{width:100%;font-size:11.5px;color:#6d7ca8;font-weight:600}

  .relhint{
    position:absolute;top:14px;left:50%;transform:translateX(-50%) translateY(-8px);opacity:0;pointer-events:none;
    background:rgba(14,20,40,.92);border:1px solid rgba(255,214,130,.4);border-radius:999px;
    padding:8px 18px;font-size:12px;font-weight:700;color:#ffe6b0;white-space:nowrap;max-width:92%;
    overflow:hidden;text-overflow:ellipsis;transition:opacity .4s ease,transform .4s ease;z-index:5;
  }
  .relhint.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .relbar{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
    background:rgba(13,19,38,.94);border:1px solid rgba(140,170,255,.32);border-radius:20px;
    padding:13px 18px;box-shadow:0 20px 50px rgba(0,0,0,.55);max-width:94%;z-index:6;
    transition:opacity .4s ease,transform .45s cubic-bezier(.2,.9,.3,1.1);
  }
  .relbar.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;transition-delay:.25s}
  .relbar .rbinfo{min-width:0}
  .relbar b{font-size:14.5px;letter-spacing:.5px;display:block}
  .relbar .rbdesc{font-size:11.5px;color:#9fb0d8;font-weight:600;display:block;margin-top:2px;max-width:420px}
  .relbar .rbacts{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .relbar a.rbgo{text-decoration:none;border:0;border-radius:999px;padding:11px 20px;font-size:13px;font-weight:800;color:#241a02;
    background:linear-gradient(100deg,#ffd97a,#fbbf24);box-shadow:0 5px 0 #8a6a1a;cursor:pointer;white-space:nowrap}
  .relbar a.rbgo:active{transform:translateY(2px);box-shadow:0 2px 0 #8a6a1a}
  .relbar button.rbbak{border:1px solid rgba(140,170,255,.45);border-radius:999px;padding:10px 18px;font-family:inherit;font-size:13px;
    font-weight:800;color:#cfe0ff;background:rgba(24,32,60,.8);cursor:pointer;white-space:nowrap}
  .relbar button.rbbak:hover{border-color:rgba(170,200,255,.8)}

  .tip{position:fixed;z-index:80;pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .18s ease,transform .18s ease;
    background:rgba(14,20,40,.96);border:1px solid rgba(130,160,230,.35);border-radius:14px;padding:12px 15px;max-width:272px;
    box-shadow:0 18px 44px rgba(0,0,0,.55)}
  .tip.show{opacity:1;transform:none}
  .tip b{font-size:14px;letter-spacing:.5px}
  .tip p{margin:5px 0 7px;font-size:12px;line-height:1.75;color:#a9b6da}
  .tip .st{font-size:11.5px;font-weight:800}
  .tip .st.ok{color:#8be9b0}
  .tip .st.no{color:#8a93b8}
  .tip .hint{display:block;margin-top:6px;font-size:10.5px;color:#6d7ca8;font-weight:700}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);opacity:0;z-index:90;
    background:rgba(14,20,40,.96);border:1px solid rgba(130,160,255,.4);border-radius:999px;padding:12px 24px;
    font-size:13px;font-weight:700;transition:all .3s ease;pointer-events:none;max-width:86vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}

  .fall{position:fixed;top:-20px;z-index:9000;pointer-events:none;width:9px;height:14px;border-radius:2px}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}

  @media (max-width:760px){
    .wrap{padding:18px 12px 80px}
    h1{font-size:20px}
    .hright{width:100%;margin-left:0;justify-content:space-between}
    .toolbar{gap:10px}
    button.rand{margin-left:0;width:100%}
    .relbar{flex-direction:column;gap:10px;padding:12px 14px;bottom:10px}
    .relbar .rbacts{width:100%;justify-content:center}
  }
  /* 移动端：整体尺寸上调一档（viewBox 更小，统一放大提升可读性） */
  #mapSvg.mob .node .label{font-size:18px}
  #mapSvg.mob .node .ico{font-size:19px}
  #mapSvg.mob .node .core{r:15px}
  #mapSvg.mob .node .halo{r:30px}
  #mapSvg.mob .node .ring{r:27px}
  #mapSvg.mob .node .glow{r:42px}
  #mapSvg.mob .node .hit{r:47px}
  #mapSvg.mob .zname{font-size:21px}
  #mapSvg.mob .zsub{font-size:13px}
  #mapSvg.mob .rel-lab{font-size:12px}
  @media (prefers-reduced-motion: reduce){
    .node .fx,.node .halo,.node .spike,.node .glow{animation:none !important;transition:none}
    .dlink .dflow,.rel-link .rl-flow,.rel-node-halo{animation:none}
    .banner{animation:none}
  }

  /* —— 返回主页（全站统一 · 2026-09-29）—— */
  .wb-home{position:fixed;left:14px;bottom:14px;z-index:9990;display:inline-flex;align-items:center;gap:5px;
    padding:8px 13px 8px 10px;border-radius:999px;text-decoration:none;
    background:rgba(17,24,39,.55);color:#fff;font-size:12.5px;font-weight:600;letter-spacing:.3px;
    -webkit-backdrop-filter:blur(10px) saturate(1.3);backdrop-filter:blur(10px) saturate(1.3);
    border:1px solid rgba(255,255,255,.14);box-shadow:0 6px 18px rgba(0,0,0,.18);
    transition:background .2s,transform .2s,box-shadow .2s}
  .wb-home:hover{background:rgba(17,24,39,.78);transform:translateY(-1px);box-shadow:0 10px 24px rgba(0,0,0,.26)}
  .wb-home:active{transform:translateY(0)}
  .wb-home svg{width:13px;height:13px;flex:0 0 auto}
  @media (max-width:620px){ .wb-home{left:10px;bottom:10px;padding:7px 11px 7px 9px;font-size:12px} }

/* ============ 🔮 ARG：第十五颗星 + 星座 ============ */
#argLayer{pointer-events:none}
#argStar{pointer-events:auto;cursor:pointer;animation:argTw 2.8s ease-in-out infinite}
#argStar .argCore{fill:#dfe9ff;filter:drop-shadow(0 0 5px rgba(198,214,240,.8))}
@keyframes argTw{0%,100%{opacity:.28}50%{opacity:.85}}
#argStar:hover{opacity:1 !important;animation-play-state:paused}
#argStar.found{animation:none;opacity:1}
.argLine{fill:none;stroke:rgba(198,214,240,.5);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 6;animation:argDash 40s linear infinite;filter:drop-shadow(0 0 6px rgba(198,214,240,.45))}
@keyframes argDash{to{stroke-dashoffset:-440}}
.argDot{fill:#eef4ff;opacity:.85}
</style>
</head>
<body>
<div class="neb a"></div><div class="neb b"></div><div class="neb c"></div>

<div class="wrap">
  <header>
    <div>
      <div class="hd-eyebrow">THE STARTIAN UNIVERSE</div>
      <h1>🗺️ 星恬的宇宙地图</h1>
      <div class="sub" id="hdSub">14 颗星串起整个小站 · 去过的会亮起来</div>
    </div>
    <div class="hright">
      <div class="prog">
        <span class="t">已点亮 <b id="litN">0</b> / <span id="litT">14</span></span>
        <div class="bar"><i id="litBar"></i></div>
      </div>
      <a class="home" href="https://startian.top/">← 返回主页</a>
    </div>
  </header>

  <div class="banner" id="banner">🎉 宇宙全图鉴达成 —— 14 颗星全部点亮，你就是这个宇宙的常客</div>

  <div class="stage" id="stage">
    <svg id="mapSvg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="全站作品星图"></svg>
    <div class="relhint" id="relhint">✦ 星图关系视图 · 点击其他星切换中心 · 点空白 / ESC 返回</div>
    <div class="relbar" id="relbar">
      <div class="rbinfo"><b id="rbName">—</b><span class="rbdesc" id="rbDesc"></span></div>
      <div class="rbacts">
        <a class="rbgo" id="rbGo" href="#">🚀 前往作品</a>
        <button class="rbbak" id="rbBack" type="button">↩ 返回星图</button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="legend">
      <span><i class="lg-dot lg-lit"></i>已点亮 · 去过的作品</span>
      <span><i class="lg-dot lg-dim"></i>暗星 · 还没去过</span>
      <span><i class="lg-line"></i>星星靠近时自动连线</span>
    </div>
    <button class="rand" id="btnRandom" type="button">🎲 带我去一颗暗星</button>
    <div class="tipnote">星星在自由漂浮，彼此靠近会自动连线 · 悬停任一颗让它停下来 · 点击星星展开「星图关系视图」· Ctrl / 中键点击直接前往</div>
  </div>
</div>

<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>


<a class="wb-home" href="https://startian.top/" title="返回星恬的小站主页">
