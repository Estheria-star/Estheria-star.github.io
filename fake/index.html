  .track.stuck .fill{animation:stuckBreathe 1.1s ease-in-out infinite}
  @keyframes stuckBreathe{0%,100%{opacity:1}50%{opacity:.55}}
  .status{margin-top:13px;font-size:12.5px;color:#8fa3cc;min-height:20px;font-weight:600}

  .opt{border:1px solid rgba(120,150,230,.35);border-radius:999px;padding:8px 15px;font-size:12.5px;font-weight:700;color:#cdd9ff;background:rgba(30,44,86,.5);cursor:pointer;font-family:inherit;transition:all .18s ease}

  .foot{font-size:11.5px;color:#5c6b94}

  .toast.show{opacity:1;transform:translateX(-50%)}
