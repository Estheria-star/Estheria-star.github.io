<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:radial-gradient(1100px 600px at 50% -80px, #14203a 0%, #0c1222 45%, #080c18 100%);color:#e8f0ff;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;overflow-x:hidden}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;gap:22px}
  .logo{display:flex;align-items:center;gap:12px}
  .orb{width:44px;height:44px;border-radius:14px;background:linear-gradient(140deg,#38bdf8,#6366f1 55%,#8b5cf6);box-shadow:0 12px 30px rgba(80,120,255,.45);animation:orbPulse 2.4s ease-in-out infinite}
  @keyframes orbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07) rotate(3deg)}}
  .logo b{font-size:17px;letter-spacing:.4px}
  .logo span{font-size:11.5px;color:#7d8fb8;font-weight:600;display:block}
  .panel{width:min(560px,92vw);background:rgba(18,26,48,.62);border:1px solid rgba(110,140,220,.22);border-radius:20px;padding:22px 24px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .pct{display:flex;align-items:baseline;gap:10px}
  .pct b{font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:.5px;background:linear-gradient(100deg,#7dd3fc,#818cf8 60%,#c084fc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .pct i{font-size:12px;color:#7d8fb8;font-style:normal;font-weight:700}
  .track{margin-top:12px;height:10px;border-radius:999px;background:rgba(10,16,32,.85);border:1px solid rgba(110,140,220,.18);overflow:hidden;position:relative}
  .fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#38bdf8,#6366f1,#a855f7);transition:width .6s cubic-bezier(.3,.8,.3,1);position:relative}
  .fill::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);animation:shine 1.4s linear infinite}
  @keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  .track.stuck .fill{animation:stuckBreathe 1.1s ease-in-out infinite}
  @keyframes stuckBreathe{0%,100%{opacity:1}50%{opacity:.55}}
  .status{margin-top:13px;font-size:12.5px;color:#8fa3cc;min-height:20px;font-weight:600}
  .status::after{content:'▍';animation:blink 1s steps(1) infinite;margin-left:2px;color:#6366f1}
  @keyframes blink{50%{opacity:0}}
  .chat{margin-top:16px;display:none;flex-direction:column;gap:9px}
  .chat.show{display:flex;animation:chatIn .5s cubic-bezier(.2,.85,.3,1.1) both}
  @keyframes chatIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .msg{max-width:86%;padding:10px 14px;border-radius:15px;font-size:13px;line-height:1.65}
  .msg.sys{align-self:flex-start;background:rgba(50,70,130,.35);border:1px solid rgba(110,140,220,.25);border-bottom-left-radius:5px;color:#dbe6ff}
  .msg.me{align-self:flex-end;background:linear-gradient(100deg,#4f6df5,#7c3aed);border-bottom-right-radius:5px;color:#fff}
  .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .opt{border:1px solid rgba(120,150,230,.35);border-radius:999px;padding:8px 15px;font-size:12.5px;font-weight:700;color:#cdd9ff;background:rgba(30,44,86,.5);cursor:pointer;font-family:inherit;transition:all .18s ease}
  .opt:hover{border-color:rgba(150,180,255,.8);transform:translateY(-1px)}
  .ask{display:flex;gap:8px;margin-top:4px}
  .ask input{flex:1;border:1.5px solid rgba(110,140,220,.3);border-radius:12px;padding:10px 13px;font-size:13px;color:#e8f0ff;background:rgba(12,18,36,.8);outline:none;font-family:inherit}
  .ask input:focus{border-color:#6366f1}
  .ask button{border:0;border-radius:12px;padding:10px 18px;font-size:13px;font-weight:800;color:#fff;background:linear-gradient(100deg,#4f6df5,#7c3aed);cursor:pointer;font-family:inherit}
  .done{display:none;text-align:center}
  .done.show{display:block;animation:chatIn .5s both}
  .done .big{font-size:22px;font-weight:900;margin-bottom:8px}
  .done p{font-size:13px;color:#8fa3cc;margin:0 0 16px;line-height:1.8}
  .go{display:inline-block;text-decoration:none;border-radius:999px;padding:12px 26px;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(100deg,#38bdf8,#6366f1,#a855f7);box-shadow:0 6px 0 #2b3a8f,0 16px 34px rgba(90,120,255,.4);transition:transform .15s ease,box-shadow .2s ease}
  .go:active{transform:translateY(2px);box-shadow:0 2px 0 #2b3a8f}
  .foot{font-size:11.5px;color:#5c6b94}
  .confetti{position:fixed;top:-20px;width:9px;height:14px;z-index:50;animation:fall lineal forwards;pointer-events:none;border-radius:2px}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.85}}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);opacity:0;z-index:60;background:rgba(20,28,52,.95);border:1px solid rgba(130,160,255,.4);border-radius:999px;padding:11px 22px;font-size:13px;font-weight:700;color:#e8f0ff;transition:all .3s ease;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%)}

/* 🔮 ARG · 卡住时，页面悄悄透出「可以打字」的气场 */
body.arg-wait{cursor:text}
body.arg-wait #status::after{content:'▍';margin-left:3px;color:#7ba6cf;animation:argBlink 1.05s steps(1) infinite}
@keyframes argBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>

<script>
(function () {
  'use strict';
  /* ============ 🏆 跨站成就 SDK ============ */
  var STAch = (function () {
    var KEY = 'st_ach';
    function readCookie() {
      var m = document.cookie.match(/(?:^|;\s*)st_ach=([^;]*)/);
      if (!m) return null;
      try { return JSON.parse(decodeURIComponent(m[1])) || []; } catch (e) { return null; }
    }
    function writeCookie(list) {
      try {
        var v = encodeURIComponent(JSON.stringify(list));
        if (v.length < 3800) document.cookie = 'st_ach=' + v + ';domain=.startian.top;path=/;max-age=31536000;SameSite=Lax';
      } catch (e) {}
    }
    var list = readCookie();
    if (!list) { try { list = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { list = []; } }
    if (!Array.isArray(list)) list = [];
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
      writeCookie(list);
    }
    function unlock(id, name, ico) {
      if (list.indexOf(id) >= 0) return false;
      list.push(id);
      save();
      try {
        var el = document.createElement('div');
        el.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);opacity:0;z-index:9999;background:rgba(20,30,58,.95);color:#fff;border:1px solid rgba(130,160,255,.45);border-radius:999px;padding:12px 22px;font:700 13.5px/1.4 system-ui,sans-serif;box-shadow:0 18px 44px rgba(0,0,0,.42);transition:opacity .4s ease,transform .4s cubic-bezier(.2,.85,.3,1.1);pointer-events:none;max-width:86vw';
        el.textContent = '🏆 成就解锁：' + (ico ? ico + ' ' : '') + (name || id);
        document.body.appendChild(el);
        requestAnimationFrame(function () { el.style.opacity = '1'; el.style.transform = 'translateX(-50%)'; });
        setTimeout(function () {
          el.style.opacity = '0';
          el.style.transform = 'translateX(-50%) translateY(16px)';
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
        }, 3200);
      } catch (e) {}
      return true;
    }
    return { list: function () { return list.slice(); }, has: function (id) { return list.indexOf(id) >= 0; }, unlock: unlock };
  })();
  window.STAch = STAch;
  setTimeout(function () { STAch.unlock('site.fake', '耐心钉子户', '🎭'); }, 600);

  var $ = function (id) { return document.getElementById(id); };

  /* ============ 假加载 ============ */
  var LOAD_LINES = [
    '正在唤醒服务器…', '正在数这页有多少个像素…', '正在给进度条做心理建设…',
    '正在优化 AI 的幽默感…', '正在从缓存里掏东西…', '正在和 CDN 握手…',
    '正在确认你没有按 F5…', '正在加载「加载中」动画…'
  ];
  var STUCK_LINES = [
    '就差一点点…（骗你的）', '99% 是世界上最远的距离', '进度条正在思考人生…',
    '它说它累了，想歇一会儿', '正在把最后 1% 拆成 100 份慢慢加载…',
    '别刷新！刷新它会更慢的（真的）', '这一格进度条正在加载它自己的加载动画…', '正在等待一个名字…', '有人在键盘前面吗？'
  ];
  var pct = 0, lineTimer = null, stuck = false;
  function setPct(v) {
    pct = v;
    $('pct').textContent = Math.floor(v);
    $('fill').style.width = v + '%';
  }
  function rollLines(arr, ms) {
    clearInterval(lineTimer);
    var i = Math.floor(Math.random() * arr.length);
    $('status').textContent = arr[i];
    lineTimer = setInterval(function () {
      i = (i + 1) % arr.length;
      $('status').textContent = arr[i];
    }, ms);
  }

  function phase(from, to, dur, next) {
    var t0 = performance.now();
    (function frame(t) {
      var k = Math.min(1, (t - t0) / dur);
      var ease = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      setPct(from + (to - from) * ease);
      if (k < 1) requestAnimationFrame(frame);
      else next && next();
    })(t0);
  }

  rollLines(LOAD_LINES, 1500);
  phase(0, 68, 1200, function () {
    phase(68, 92, 1500, function () {
      phase(92, 99, 2200, function () {
        /* 卡在 99% */
        stuck = true;
        $('track').classList.add('stuck');
        $('eta').textContent = '预计剩余：一小会儿';
        rollLines(STUCK_LINES, 1800);
        setTimeout(openChat, 4200);
      });
    });
  });

  /* ============ 聊天 ============ */
  var CHAT_REPLIES = {
    time: ['快了快了，就差 1%…… 好吧，其实这 1% 是薛定谔的。', '根据我的精密计算：大约还需要「一会儿」。', '你问加载还要多久？这个问题比加载本身更难。'],
    who: ['我啊？一个假装在加载的页面而已。', '我是 startian.top 的门卫，负责拦住性急的人。', '本体是一个进度条，兴趣是摸鱼。'],
    go: ['别走嘛，走了这段对话就白写了。', '门在那边，但进度条求你再陪它一会儿。', '再等一下下，它马上就不装了。'],
    why: ['因为加载太快的话，谁还记得住这个页面呢。', '慢，是一种仪式感。', '真相是：服务器在午睡。'],
    love: ['谢谢！这段对话是本次加载里最值钱的部分。', '诶嘿，进度条听了都往前挪了 0.1%。'],
    other: ['嗯嗯，有道理（其实没听懂）。', '你说得对，但是进度条正在加载。', '先别急着吐槽，它已经很努力了。', '这个问题超纲了，它只会加载。', '我在听我在听，你继续说。']
  };
  function matchReply(txt) {
    var t = txt || '';
    if (/多久|时间|还要|几时|快不|什么时候/.test(t)) return pick(CHAT_REPLIES.time);
    if (/你是谁|你谁|什么人|谁啊|自我介绍/.test(t)) return pick(CHAT_REPLIES.who);
    if (/走|退|关|撤|不玩|拜拜|再见|88/.test(t)) return pick(CHAT_REPLIES.go);
    if (/为什么|为啥|怎么会|咋/.test(t)) return pick(CHAT_REPLIES.why);
    if (/可爱|喜欢|爱你|厉害|牛|赞|棒/.test(t)) return pick(CHAT_REPLIES.love);
    if (/等什么|等谁|名字|密码|怎么开|开门/.test(t)) return '它在等一个名字。八个字母……你一路攒的那些，拼起来就是。';
    return pick(CHAT_REPLIES.other);
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  var chatOpened = false;
  function addMsg(cls, text) {
    var d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    $('chat').insertBefore(d, $('chat').querySelector('.ask'));
    d.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function openChat() {
    if (chatOpened) return;
    chatOpened = true;
    $('m0').textContent = '嗯…这个加载好像有点慢哈。反正也是干等，不如聊两句？';
    $('chat').classList.add('show');
    renderOpts([
      ['多久能好？', '多久能好？'],
      ['你是谁呀？', '你是谁呀？'],
      ['它在等什么？', '它在等什么？'],
      ['我走了', '我走了'],
      ['为什么不快点？', '为什么不快点？']
    ]);
  }

  function renderOpts(opts) {
    var wrap = $('opts');
    wrap.innerHTML = opts.map(function (o, i) {
      return '<button class="opt" type="button" data-i="' + i + '">' + o[0] + '</button>';
    }).join('');
    wrap.onclick = function (e) {
      var b = e.target.closest('.opt');
      if (!b) return;
      var o = opts[+b.getAttribute('data-i')];
      ask(o[1]);
    };
  }

  var askCount = 0;
  function ask(txt) {
    if (!txt.trim()) return;
    askCount++;
    addMsg('me', txt);
    $('opts').innerHTML = '';
    setTimeout(function () {
      addMsg('sys', matchReply(txt));
      if (askCount >= 2 && !stuckDone) endShow();
      else {
        var nxt = [];
        if (!askedTime) { nxt.push(['到底还要多久？', '到底还要多久？']); askedTime = true; }
        if (!askedWho) { nxt.push(['你到底是什么页面？', '你到底是什么页面？']); askedWho = true; }
        if (!askedGo) { nxt.push(['我真的要走了', '我真的要走了']); askedGo = true; }
        nxt.push([pick(['它平时也这样吗？', '那我再等等吧', '来个冷知识', '测试一下关键词：可爱']), pick(['它平时也这样吗？', '那我再等等吧', '来个冷知识', '你好可爱'])]);
        renderOpts(nxt);
      }
    }, 620 + Math.random() * 500);
  }
  var askedTime = false, askedWho = false, askedGo = false, stuckDone = false;

  $('askGo').addEventListener('click', function () { ask($('askIn').value); $('askIn').value = ''; });
  $('askIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('askGo').click(); });

  /* ============ 收尾反转 ============ */
  function endShow() {
    stuckDone = true;
    addMsg('sys', '好吧，不装了 —— 其实它早就加载完了。剩下这 1% 是我给这段对话留的。');
    setTimeout(function () {
      $('chat').classList.remove('show');
      $('track').classList.remove('stuck');
      $('eta').textContent = '';
      $('status').textContent = '冲刺最后一格…';
      phase(pct, 100, 700, function () {
        $('status').textContent = '完成 ✔';
        $('doneTip').textContent = '感谢你陪这个进度条聊完这段天。作为回报：门已经开了，进去玩吧。';
        $('done').classList.add('show');
        confetti();
        try { STAch.unlock('fake.done', '陪进度条聊天的人', '🎭'); } catch (e) {}
      });
    }, 1800);
  }
  /* 兜底：如果用户一直不说话，60 秒后也放行（附彩蛋文案） */
  setTimeout(function () { if (!stuckDone && chatOpened) endShow(); }, 60000);

  function confetti() {
    var cols = ['#38bdf8', '#6366f1', '#a855f7', '#f472b6', '#fbbf24', '#34d399'];
    for (var i = 0; i < 90; i++) {
      var s = document.createElement('span');
      s.className = 'confetti';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.background = cols[i % cols.length];
      s.style.animationDuration = (1.6 + Math.random() * 1.8) + 's';
      s.style.animationDelay = (Math.random() * 0.8) + 's';
      document.body.appendChild(s);
      setTimeout(function (el) { return function () { if (el.parentNode) el.parentNode.removeChild(el); }; }(s), 4200);
    }
  }

  var toastEl = $('toast'), toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }
})();
</script>

<script>
/* ============================================================
   🔮 ARG · 精简进度机（2026-10-03）与主页共用 st_arg
   ============================================================ */
(function () {
  'use strict';
  var KEY = 'st_arg';
  if (window.ARG && window.ARG.collect) return;
  function readState() {
    var raw = null;
    try { var m = document.cookie.match(/(?:^|;\s*)st_arg=([^;]*)/); if (m) raw = decodeURIComponent(m[1]); } catch (e) {}
    if (!raw) { try { raw = localStorage.getItem(KEY); } catch (e) {} }
    try { var d = JSON.parse(raw || '{}'); if (!d || typeof d !== 'object') d = {}; if (!Array.isArray(d.logs)) d.logs = []; return d; }
    catch (e) { return { logs: [] }; }
  }
  var state = readState();
  function save() {
    var raw = JSON.stringify(state);
    try { localStorage.setItem(KEY, raw); } catch (e) {}
    try {
      var v = encodeURIComponent(raw);
      if (v.length < 3800) document.cookie = 'st_arg=' + v + ';domain=.startian.top;path=/;max-age=31536000;SameSite=Lax';
    } catch (e) {}
  }
  var toastTimer = 0;
  window.ARG = {
    has: function (id) { return state.logs.indexOf(id) >= 0; },
    count: function () { return state.logs.length; },
    collect: function (id) {
      if (state.logs.indexOf(id) >= 0) return false;
      state.logs.push(id); save();
      this.toast('📜 找到一篇日志（去主页头像连点 7 下看全文）');
      return true;
    },
    reset: function () { state = { logs: [] }; save(); },
    toast: function (msg) {
      try {
        var el = document.getElementById('__arg_toast');
        if (!el) {
          el = document.createElement('div');
          el.id = '__arg_toast';
          el.style.cssText = 'position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(16px);opacity:0;z-index:9994;background:rgba(12,17,32,.96);color:#eef4ff;border:1px solid rgba(198,214,240,.4);border-radius:999px;padding:12px 24px;font:700 13px/1.5 system-ui,sans-serif;box-shadow:0 18px 44px rgba(0,0,0,.5);transition:all .45s cubic-bezier(.2,.85,.3,1.1);pointer-events:none;max-width:88vw;text-align:center';
          document.body.appendChild(el);
        }
        el.textContent = msg;
        requestAnimationFrame(function () { el.style.opacity = '1'; el.style.transform = 'translateX(-50%)'; });
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.style.opacity = '0'; el.style.transform = 'translateX(-50%) translateY(16px)'; }, 3000);
      } catch (e) {}
    }
  };
})();
</script>

<script>
/* 🔮 ARG · 假加载页：卡在 99% 时，敲出那个名字 */
(function () {
  'use strict';
  var buf = '', gateDone = false;
  function stuckNow() {
    var t = document.getElementById('track');
    var d = document.getElementById('done');
    return (t && t.classList.contains('stuck')) || (d && d.classList.contains('show'));
  }
  function openGate() {
    if (gateDone) return;
    gateDone = true;
    document.getElementById('fill').style.width = '100%';
    document.getElementById('pct').textContent = '100';
    var track = document.getElementById('track');
    if (track) track.classList.remove('stuck');
    var eta = document.getElementById('eta'); if (eta) eta.textContent = '';
    var status = document.getElementById('status');
    if (status) status.textContent = '正在识别……「estheria」……通过';
