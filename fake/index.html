<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="一个非常正经的加载页面。真的。startian.top 出品">
<meta name="theme-color" content="#0a0e1a">
<title>正在加载… · startian.top</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:radial-gradient(1100px 600px at 50% -80px, #14203a 0%, #0c1222 45%, #080c18 100%);color:#e8f0ff;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;overflow-x:hidden}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;gap:22px}
  .logo{display:flex;align-items:center;gap:12px}
  .orb{width:44px;height:44px;border-radius:14px;background:linear-gradient(140deg,#38bdf8,#6366f1 55%,#8b5cf6);box-shadow:0 12px 30px rgba(80,120,255,.45);animation:orbPulse 2.4s ease-in-out infinite}
  @keyframes orbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07) rotate(3deg)}}
  .logo b{font-size:17px;letter-spacing:.4px}
  .logo span{font-size:11.5px;color:#7d8fb8;font-weight:600;display:block}
  .panel{width:min(560px,92vw);background:rgba(18,26,48,.62);border:1px solid rgba(110,140,220,.22);border-radius:20px;padding:22px 24px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .pct{display:flex;align-items:baseline;gap:10px}
  .pct b{font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:.5px;background:linear-gradient(100deg,#7dd3fc,#818cf8 60%,#c084fc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .pct i{font-size:12px;color:#7d8fb8;font-style:normal;font-weight:700}
  .track{margin-top:12px;height:10px;border-radius:999px;background:rgba(10,16,32,.85);border:1px solid rgba(110,140,220,.18);overflow:hidden;position:relative}
  .fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#38bdf8,#6366f1,#a855f7);transition:width .6s cubic-bezier(.3,.8,.3,1);position:relative}
  .fill::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);animation:shine 1.4s linear infinite}
  @keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  .track.stuck .fill{animation:stuckBreathe 1.1s ease-in-out infinite}
  @keyframes stuckBreathe{0%,100%{opacity:1}50%{opacity:.55}}
  .status{margin-top:13px;font-size:12.5px;color:#8fa3cc;min-height:20px;font-weight:600}
  .status::after{content:'▍';animation:blink 1s steps(1) infinite;margin-left:2px;color:#6366f1}
  @keyframes blink{50%{opacity:0}}
  .chat{margin-top:16px;display:none;flex-direction:column;gap:9px}
  .chat.show{display:flex;animation:chatIn .5s cubic-bezier(.2,.85,.3,1.1) both}
  @keyframes chatIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .msg{max-width:86%;padding:10px 14px;border-radius:15px;font-size:13px;line-height:1.65}
  .msg.sys{align-self:flex-start;background:rgba(50,70,130,.35);border:1px solid rgba(110,140,220,.25);border-bottom-left-radius:5px;color:#dbe6ff}
  .msg.me{align-self:flex-end;background:linear-gradient(100deg,#4f6df5,#7c3aed);border-bottom-right-radius:5px;color:#fff}
  .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .opt{border:1px solid rgba(120,150,230,.35);border-radius:999px;padding:8px 15px;font-size:12.5px;font-weight:700;color:#cdd9ff;background:rgba(30,44,86,.5);cursor:pointer;font-family:inherit;transition:all .18s ease}
  .opt:hover{border-color:rgba(150,180,255,.8);transform:translateY(-1px)}
  .ask{display:flex;gap:8px;margin-top:4px}
  .ask input{flex:1;border:1.5px solid rgba(110,140,220,.3);border-radius:12px;padding:10px 13px;font-size:13px;color:#e8f0ff;background:rgba(12,18,36,.8);outline:none;font-family:inherit}
  .ask input:focus{border-color:#6366f1}
  .ask button{border:0;border-radius:12px;padding:10px 18px;font-size:13px;font-weight:800;color:#fff;background:linear-gradient(100deg,#4f6df5,#7c3aed);cursor:pointer;font-family:inherit}
  .done{display:none;text-align:center}
  .done.show{display:block;animation:chatIn .5s both}
  .done .big{font-size:22px;font-weight:900;margin-bottom:8px}
  .done p{font-size:13px;color:#8fa3cc;margin:0 0 16px;line-height:1.8}
  .go{display:inline-block;text-decoration:none;border-radius:999px;padding:12px 26px;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(100deg,#38bdf8,#6366f1,#a855f7);box-shadow:0 6px 0 #2b3a8f,0 16px 34px rgba(90,120,255,.4);transition:transform .15s ease,box-shadow .2s ease}
  .go:active{transform:translateY(2px);box-shadow:0 2px 0 #2b3a8f}
  .foot{font-size:11.5px;color:#5c6b94}
  .confetti{position:fixed;top:-20px;width:9px;height:14px;z-index:50;animation:fall lineal forwards;pointer-events:none;border-radius:2px}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.85}}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);opacity:0;z-index:60;background:rgba(20,28,52,.95);border:1px solid rgba(130,160,255,.4);border-radius:999px;padding:11px 22px;font-size:13px;font-weight:700;color:#e8f0ff;transition:all .3s ease;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%)}

/* 🔮 ARG · 卡住时，页面悄悄透出「可以打字」的气场 */
body.arg-wait{cursor:text}
body.arg-wait #status::after{content:'▍';margin-left:3px;color:#7ba6cf;animation:argBlink 1.05s steps(1) infinite}
@keyframes argBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>

  <div class="logo">

<script>
/* ==== i18n-kit v1.2 begin ==== */
/* ══════════════════════════════════════════════════════════
   🌐 多语言 i18n Kit（startian.top 全站共享 · v1.2 · 2026-10-04）
   · 语言：zh（默认）/ en；跨站同步 cookie st_lang(.startian.top) + localStorage 兜底
   · 自动识别：首次访问按 navigator.language（zh 开头 → 中文，其余 → English）
   · 两种接入模式（可混用）：
     ① 短语表模式（推荐，低侵入）：I18N.phrase({ '中文原文': 'English', ... })
        自动扫描文本节点 / title / placeholder / aria-label / alt，动态插入的文本也自动翻译
     ② 标注模式：data-i18n / data-i18n-html / data-i18n-title / data-i18n-aria / data-i18n-ph / data-i18n-alt
   · 子树上加 data-i18n-skip 可整体跳过（用户输入内容、ARG 谜题原文等）
   · API：I18N.t(k[,vars]) · I18N.tOr(k,fb) · I18N.tr(原文) · I18N.set(lang) · I18N.lang()
          · I18N.phrase(map) · I18N.scan(root) · I18N.apply(root) · I18N.onChange(fn)
          · I18N.fmtDate(date[,{weekday:true}]) · I18N.fmtNum(n)
   · 切换入口：固定右下角胶囊（本 Kit 自动注入，无需页面代码）
   ══════════════════════════════════════════════════════════ */
var I18N = (function () {
  'use strict';
  var LS = 'st_lang';
  var FALLBACK = 'zh';
  var lang = FALLBACK;
  var dict = { zh: {}, en: {} };
  var phrase = {};      /* 短语表：中文原文（归一化）→ 译文 */
  var listeners = [];
  var bd = {};          /* boot data：原文快照等 */

  /* ---- 基础词典（全站通用词条） ---- */
  dict.zh['common.home'] = '主页';
  dict.en['common.home'] = 'Home';
  dict.zh['common.homeTitle'] = '返回星恬的小站主页';
  dict.en['common.homeTitle'] = "Back to Startian's homepage";
  dict.zh['common.close'] = '关闭';
  dict.en['common.close'] = 'Close';
  dict.zh['common.cancel'] = '取消';
  dict.en['common.cancel'] = 'Cancel';

  /* ---- 存储与识别 ---- */
  function norm(v) {
    v = String(v || '').toLowerCase();
    if (v.indexOf('zh') === 0) return 'zh';
    if (v.indexOf('en') === 0) return 'en';
    return null;
  }
  function readCookie() {
    try { var m = document.cookie.match(/(?:^|;\s*)st_lang=([^;]*)/); return m ? decodeURIComponent(m[1]) : null; }
    catch (e) { return null; }
  }
  function readLS() { try { return localStorage.getItem(LS); } catch (e) { return null; } }
  function persist(v) {
    try { localStorage.setItem(LS, v); } catch (e) {}
    try { document.cookie = 'st_lang=' + encodeURIComponent(v) + ';domain=.startian.top;path=/;max-age=31536000;SameSite=Lax'; } catch (e) {}
  }
  function detect() {
    var s = norm(readCookie()) || norm(readLS());
    if (s) return s;
    var n = norm(navigator.language || navigator.userLanguage);
    return n || FALLBACK;
  }

  /* ---- 文案 ---- */
  /* tRaw：查词典（当前语言 → zh 兜底），查不到返回 null（= 保持原文） */
  function tRaw(key) {
    var v = (dict[lang] && dict[lang][key] != null) ? dict[lang][key] : null;
    if (v == null) v = (dict[FALLBACK] && dict[FALLBACK][key] != null) ? dict[FALLBACK][key] : null;
    return v;
  }
  function t(key, vars) {
    var v = tRaw(key);
    if (v == null) return key;
    if (vars) v = String(v).replace(/\{(\w+)\}/g, function (m, k) { return (vars[k] != null) ? vars[k] : m; });
    return v;
  }
  /* tOr：查不到时用传入的兜底值（页面 JS 动态文案用这个） */
  function tOr(key, fallback) {
    var v = tRaw(key);
    return (v == null) ? fallback : v;
  }
  function add(obj) {
    if (!obj) return;
    ['zh', 'en'].forEach(function (k) {
      if (obj[k]) for (var key in obj[k]) dict[k][key] = obj[k][key];
    });
  }
  /* tr：短语表直译（原文进，译文出；zh 侧原样返回）-JS 动态文案直接用 */
  function tr(s) {
    if (lang === 'zh') return s;
    var v = lookup(normText(s));
    return (v == null) ? s : v;
  }
  function addPhrase(map) {
    if (!map) return;
    for (var k in map) { if (map[k] != null) phrase[normText(k)] = String(map[k]); }
  }
  /* 规则表：[[/正则/, '替换（可用 $1）'], ...] - 处理「已复习 3」「12 天有记录」这类数字拼接 */
  var rules = [];
  function addRules(list) {
    if (!list) return;
    for (var i = 0; i < list.length; i++) {
      try {
        var re = (list[i][0] instanceof RegExp) ? list[i][0] : new RegExp(list[i][0]);
        rules.push([re, String(list[i][1])]);
      } catch (e) {}
    }
  }
  function lookup(t) {
    var v = phrase[t];
    if (v != null) return v;
    for (var i = 0; i < rules.length; i++) {
      try { if (rules[i][0].test(t)) return t.replace(rules[i][0], rules[i][1]); } catch (e) {}
    }
    return null;
  }

  /* ---- 短语表扫描（静态 + 动态） ---- */
  function normText(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }
  var PTAGS = ['title', 'placeholder', 'aria-label', 'alt'];
  function translText(node) {
    var raw = node.nodeValue;
    if (!raw) return;
    var rec = node.__i18nR;
    if (rec) {
      if (lang === 'zh') {
        if (raw === rec.en) { node.nodeValue = rec.orig; delete node.__i18nR; }
        else if (raw !== rec.orig) { delete node.__i18nR; }
        return;
      }
      if (raw === rec.en) return;
      if (raw === rec.orig) { node.nodeValue = rec.en; return; }
      delete node.__i18nR;
    }
    var out = lookup(normText(raw));
    if (out == null) return;
    if (lang === 'en') { if (raw !== out) { node.__i18nR = { orig: raw, en: out }; node.nodeValue = out; } }
  }
  function translAttrs(el) {
    if (!el.getAttribute) return;
    for (var i = 0; i < PTAGS.length; i++) {
      var a = PTAGS[i], v = el.getAttribute(a);
      if (v == null || v === '') continue;
      var rec = el.__i18nA && el.__i18nA[a];
      if (rec) {
        if (lang === 'zh') {
          if (v === rec.en) { el.setAttribute(a, rec.orig); delete el.__i18nA[a]; }
          else if (v !== rec.orig) { delete el.__i18nA[a]; }
          continue;
        }
        if (v === rec.en) continue;
        if (v === rec.orig) { el.setAttribute(a, rec.en); continue; }
        delete el.__i18nA[a];
      }
      var out = lookup(normText(v));
      if (out == null) continue;
      if (lang === 'en') {
        if (v !== out) { if (!el.__i18nA) el.__i18nA = {}; el.__i18nA[a] = { orig: v, en: out }; el.setAttribute(a, out); }
      }
    }
  }
  function scanNode(node) {
    if (!node) return;
    if (node.nodeType === 9) node = node.documentElement || node.body;   /* 文档节点 → 转元素 */
    if (!node) return;
    if (node.nodeType === 3) { translText(node); return; }
    if (node.nodeType !== 1) return;
    var tag = node.tagName;
    if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'TEXTAREA' || tag === 'NOSCRIPT') return;
    if (node.hasAttribute('data-i18n-skip')) return;
    translAttrs(node);
    for (var c = node.firstChild; c; c = c.nextSibling) scanNode(c);
  }
  function scan(root) { try { scanNode(root || document.body || document.documentElement); } catch (e) {} }
  /* 动态内容自动翻译（MutationObserver，逐节点增量，无重扫） */
  var moOn = false;
  function auto(root) {
    if (moOn || typeof MutationObserver === 'undefined') return;
    var target = root || document.body;
    if (!target) {   /* head 提前注入时 body 还没解析出来，等 DOM ready */
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { auto(root); });
      return;
    }
    moOn = true;
    try {
      var mo = new MutationObserver(function (muts) {
        for (var i = 0; i < muts.length; i++) {
          var m = muts[i];
          try {
            if (m.type === 'characterData') translText(m.target);
            else if (m.type === 'attributes') translAttrs(m.target);
            else if (m.type === 'childList') {
              for (var j = 0; j < m.addedNodes.length; j++) scanNode(m.addedNodes[j]);
            }
          } catch (e) {}
        }
      });
      mo.observe(target, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: PTAGS });
    } catch (e) {}
  }

  /* ---- 日期 / 数字 ---- */
  var MN_EN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var WD_ZH = '日一二三四五六';
  var WD_EN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  function fmtDate(d, opt) {
    if (typeof d === 'string') { var a = d.split('-'); d = new Date(+a[0], (+a[1] || 1) - 1, +a[2] || 1); }
    if (!(d instanceof Date) || isNaN(d.getTime())) return '';
    opt = opt || {};
    var s;
    if (lang === 'zh') {
      s = d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
      if (opt.weekday) s += ' · 星期' + WD_ZH.charAt(d.getDay());
    } else {
      s = MN_EN[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
      if (opt.weekday) s += ' · ' + WD_EN[d.getDay()];
    }
    return s;
  }
  function fmtNum(n) {
    try { return Number(n).toLocaleString(lang === 'zh' ? 'zh-CN' : 'en-US'); }
    catch (e) { return String(n); }
  }

  /* ---- DOM 标注应用（标注模式；词条缺失时恢复原文 - 保证切回中文能还原） ---- */
  function apply(root) {
    root = root || document;
    try {
      var i, list, v, el;
      list = root.querySelectorAll('[data-i18n]');
      for (i = 0; i < list.length; i++) {
        el = list[i];
        if (el.__i18nOrig == null) el.__i18nOrig = el.textContent;
        v = tRaw(el.getAttribute('data-i18n'));
        el.textContent = (v != null) ? v : el.__i18nOrig;
      }
      list = root.querySelectorAll('[data-i18n-html]');
      for (i = 0; i < list.length; i++) {
        el = list[i];
        if (el.__i18nOrigHTML == null) el.__i18nOrigHTML = el.innerHTML;
        v = tRaw(el.getAttribute('data-i18n-html'));
        el.innerHTML = (v != null) ? v : el.__i18nOrigHTML;
      }
      list = root.querySelectorAll('[data-i18n-title]');
      for (i = 0; i < list.length; i++) {
        el = list[i];
        if (el.__i18nOrigTitle == null) el.__i18nOrigTitle = el.title;
        v = tRaw(el.getAttribute('data-i18n-title'));
        el.title = (v != null) ? v : el.__i18nOrigTitle;
      }
      list = root.querySelectorAll('[data-i18n-aria]');
      for (i = 0; i < list.length; i++) {
        el = list[i];
        if (el.__i18nOrigAria == null) el.__i18nOrigAria = el.getAttribute('aria-label') || '';
        v = tRaw(el.getAttribute('data-i18n-aria'));
        el.setAttribute('aria-label', (v != null) ? v : el.__i18nOrigAria);
      }
      list = root.querySelectorAll('[data-i18n-ph]');
      for (i = 0; i < list.length; i++) {
        el = list[i];
        if (el.__i18nOrigPh == null) el.__i18nOrigPh = el.placeholder || '';
        v = tRaw(el.getAttribute('data-i18n-ph'));
        el.placeholder = (v != null) ? v : el.__i18nOrigPh;
      }
      list = root.querySelectorAll('[data-i18n-alt]');
      for (i = 0; i < list.length; i++) {
        el = list[i];
        if (el.__i18nOrigAlt == null) el.__i18nOrigAlt = el.getAttribute('alt') || '';
        v = tRaw(el.getAttribute('data-i18n-alt'));
        el.setAttribute('alt', (v != null) ? v : el.__i18nOrigAlt);
      }
      /* 标题（短语表优先，其次 page.title 词条） */
      if (!bd.__origTitle) bd.__origTitle = document.title;
      var tv = lookup(normText(bd.__origTitle));
      if (tv == null) tv = tRaw('page.title');
      if (tv != null) { document.title = (lang === 'en') ? tv : bd.__origTitle; bd.__titleTouched = true; }
      else if (bd.__titleTouched) { document.title = bd.__origTitle; }
      document.documentElement.lang = (lang === 'zh') ? 'zh-CN' : 'en';
      syncSwitch();
    } catch (e) {}
  }

  function applyLang(v) {
    lang = v;
    persist(v);
    apply(document);
    scan(document);
    for (var i = 0; i < listeners.length; i++) { try { listeners[i](lang); } catch (e) {} }
    try {
      var live = document.getElementById('i18n-live');
      if (live) live.textContent = (lang === 'zh') ? '已切换到中文' : 'Switched to English';
    } catch (e) {}
  }
  /* 切换转场（仿主页主题转场）：黑幕淡入 → 光晕从切换器扩散 → 幕中换语言 → 揭幕；可打断；尊重 reduced-motion */
  var tid = 0, stage = null;
  function ensureStage() {
    if (stage) return stage;
    var ov = document.createElement('div'); ov.className = 'i18n-veil';
    var hl = document.createElement('div'); hl.className = 'i18n-halo';
    var host = document.body || document.documentElement;
    host.appendChild(ov); host.appendChild(hl);
    stage = { ov: ov, hl: hl };
    return stage;
  }
  function set(v) {
    v = norm(v);
    if (!v) return;
    if (v === lang) { apply(document); scan(document); return; }
    var calm = true;
    try { calm = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}
    if (!calm || !document.body) { applyLang(v); return; }
    try {
      var st = ensureStage(), my = ++tid;
      var x = (window.innerWidth || 360) - 80, y = (window.innerHeight || 640) - 34;

    }, 1800);
  }
  /* 兜底：如果用户一直不说话，60 秒后也放行（附彩蛋文案） */
  setTimeout(function () { if (!stuckDone && chatOpened) endShow(); }, 60000);

  function confetti() {
    var cols = ['#38bdf8', '#6366f1', '#a855f7', '#f472b6', '#fbbf24', '#34d399'];
    for (var i = 0; i < 90; i++) {
      var s = document.createElement('span');
      s.className = 'confetti';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.background = cols[i % cols.length];
      s.style.animationDuration = (1.6 + Math.random() * 1.8) + 's';
      s.style.animationDelay = (Math.random() * 0.8) + 's';
      document.body.appendChild(s);
      setTimeout(function (el) { return function () { if (el.parentNode) el.parentNode.removeChild(el); }; }(s), 4200);
    }
  }

  var toastEl = $('toast'), toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }
})();
</script>

<script>
/* ============================================================
   🔮 ARG · 精简进度机（2026-10-03）与主页共用 st_arg
   ============================================================ */
(function () {
  'use strict';
  var KEY = 'st_arg';
  if (window.ARG && window.ARG.collect) return;
  function readState() {
    var raw = null;
    try { var m = document.cookie.match(/(?:^|;\s*)st_arg=([^;]*)/); if (m) raw = decodeURIComponent(m[1]); } catch (e) {}
    if (!raw) { try { raw = localStorage.getItem(KEY); } catch (e) {} }
    try { var d = JSON.parse(raw || '{}'); if (!d || typeof d !== 'object') d = {}; if (!Array.isArray(d.logs)) d.logs = []; return d; }
    catch (e) { return { logs: [] }; }
  }
  var state = readState();
  function save() {
    var raw = JSON.stringify(state);
    try { localStorage.setItem(KEY, raw); } catch (e) {}
    try {
      var v = encodeURIComponent(raw);
      if (v.length < 3800) document.cookie = 'st_arg=' + v + ';domain=.startian.top;path=/;max-age=31536000;SameSite=Lax';
    } catch (e) {}
  }
  var toastTimer = 0;
  window.ARG = {
    has: function (id) { return state.logs.indexOf(id) >= 0; },
    count: function () { return state.logs.length; },
    collect: function (id) {
      if (state.logs.indexOf(id) >= 0) return false;
      state.logs.push(id); save();
      this.toast('📜 找到一篇日志（去主页头像连点 7 下看全文）');
      return true;
    },
    reset: function () { state = { logs: [] }; save(); },
    toast: function (msg) {
      try {
        var el = document.getElementById('__arg_toast');
        if (!el) {
          el = document.createElement('div');
          el.id = '__arg_toast';
          el.style.cssText = 'position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(16px);opacity:0;z-index:9994;background:rgba(12,17,32,.96);color:#eef4ff;border:1px solid rgba(198,214,240,.4);border-radius:999px;padding:12px 24px;font:700 13px/1.5 system-ui,sans-serif;box-shadow:0 18px 44px rgba(0,0,0,.5);transition:all .45s cubic-bezier(.2,.85,.3,1.1);pointer-events:none;max-width:88vw;text-align:center';
          document.body.appendChild(el);
        }
        el.textContent = msg;
        requestAnimationFrame(function () { el.style.opacity = '1'; el.style.transform = 'translateX(-50%)'; });
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.style.opacity = '0'; el.style.transform = 'translateX(-50%) translateY(16px)'; }, 3000);
      } catch (e) {}
    }
  };
})();
</script>

<script>
/* 🔮 ARG · 假加载页：卡在 99% 时，敲出那个名字 */
(function () {
  'use strict';
  var buf = '', gateDone = false;
  function stuckNow() {
    var t = document.getElementById('track');
    var d = document.getElementById('done');
    return (t && t.classList.contains('stuck')) || (d && d.classList.contains('show'));
  }
  function openGate() {
    if (gateDone) return;
    gateDone = true;
    document.getElementById('fill').style.width = '100%';
    document.getElementById('pct').textContent = '100';
    var track = document.getElementById('track');
    if (track) track.classList.remove('stuck');
    var eta = document.getElementById('eta'); if (eta) eta.textContent = '';
    var status = document.getElementById('status');
    if (status) status.textContent = '正在识别……「estheria」……通过';
    window.ARG.collect('log9');
    setTimeout(function () {
      if (status) status.textContent = '完成 ✔';
      var done = document.getElementById('done');
      var tip = document.getElementById('doneTip');
      if (tip) tip.textContent = '……哦，是你。门不用陪它聊，已经开了。';
      if (done) done.classList.add('show');
    }, 900);
  }
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    var tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (!e.key || e.key.length !== 1) return;
    buf = (buf + e.key.toLowerCase()).slice(-16);
    if (buf.slice(-8) === 'estheria' && stuckNow()) openGate();
  });
  (function () {
    var tr = document.getElementById('track');
    if (!tr) return;
    function sync() {
      try { document.body.classList.toggle('arg-wait', tr.classList.contains('stuck')); } catch (e) {}
    }
    try { new MutationObserver(sync).observe(tr, { attributes: true, attributeFilter: ['class'] }); } catch (e) {}
    setInterval(sync, 800);
    sync();
  })();
  window.__fakeARG = { force: openGate, gate: openGate, stuckNow: stuckNow };
})();
</script>
