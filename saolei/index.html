  var LS = 'st_lang';
  var FALLBACK = 'zh';
  var lang = FALLBACK;
  var dict = { zh: {}, en: {} };

  var listeners = [];

      if (cells[x].mine) continue;
      var n2 = neighbors(x), cnt = 0;
      for (var y = 0; y < n2.length; y++) if (cells[n2[y]].mine) cnt++;
      cells[x].num = cnt;
    }
  }

  /* ============ 渲染 ============ */
  function cellEl(i) { return board.children[i]; }
  function renderCell(i) {
    var el = cellEl(i); if (!el) return;
    var c = cells[i];
    el.className = 'cell';
    el.textContent = '';
    if (c.open) {
      el.classList.add('open');
      if (c.mine) { el.textContent = '💣'; }
      else if (c.num > 0) { el.classList.add('n' + c.num); el.textContent = String(c.num); }
    } else {
      if (c.flag) { el.classList.add('flag'); el.textContent = '🚩'; }
    }
    if (over) el.classList.add('locked');
  }
  function renderAll() {
    board.innerHTML = '';
    board.style.gridTemplateColumns = 'repeat(' + cols + ', var(--cell))';
    for (var i = 0; i < cells.length; i++) {
      var el = document.createElement('div');
      el.className = 'cell';
      el.setAttribute('data-i', String(i));
      board.appendChild(el);
    }
    for (var j = 0; j < cells.length; j++) renderCell(j);
  }

  /* ============ 计时 ============ */
  function startTimer() {
    if (timerId) return;
    timerId = setInterval(function () {
      seconds++;
      timerEl.textContent = fmtTime(seconds);
    }, 1000);
  }
  function stopTimer() { clearInterval(timerId); timerId = null; }

  /* ============ 翻开逻辑 ============ */
  function floodOpen(start) {
    var stack = [start];
    while (stack.length) {
      var i = stack.pop();
      var c = cells[i];
      if (c.open || c.flag) continue;
      c.open = true;
      openedCount++;
      renderCell(i);
      if (c.num === 0 && !c.mine) {
        var ns = neighbors(i);
        for (var k = 0; k < ns.length; k++) {
          if (!cells[ns[k]].open && !cells[ns[k]].flag) stack.push(ns[k]);
        }
      }
    }
  }
  function openCell(i) {
    if (over) return;
    var c = cells[i];
    if (c.open || c.flag) return;
    if (!started) {
      started = true;
      placeMines(i);
      startTimer();
    }
    if (c.mine) { lose(i); return; }
    floodOpen(i);
    checkWin();
  }
  function checkWin() {
    if (openedCount >= rows * cols - mines) {
      win = true; over = true;
      stopTimer();
      faceEl.textContent = '😎';
      var playerFlagCount = flagCount;   /* 自动插旗前：玩家自己插的旗数 */
      // 自动插旗剩余雷
      for (var i = 0; i < cells.length; i++) {
        if (cells[i].mine && !cells[i].flag) { cells[i].flag = true; flagCount++; renderCell(i); }
      }
      mineNumEl.textContent = '0';
      var b = loadBest();
      var isNew = (b[diff] === undefined || seconds < b[diff]);
      if (isNew) { b[diff] = seconds; saveBest(b); renderBest(); }
      /* —— 成就 —— */
      try {
        if (!STAch.has('saolei.first_win')) STAch.unlock('saolei.first_win', achName('旗开得胜', 'First Victory'), '🚩');
        if (diff === 'mid') STAch.unlock('saolei.win_mid', achName('中级排雷手', 'Intermediate Sweeper'), '🧭');
        if (diff === 'hard') STAch.unlock('saolei.win_hard', achName('高级排雷专家', 'Expert Deminer'), '🏅');
        if (diff === 'easy' && seconds <= 60) STAch.unlock('saolei.speed', achName('闪电排雷', 'Lightning Clear'), '⚡');
        if (playerFlagCount === 0) STAch.unlock('saolei.noflag', achName('徒手排雷', 'Flagless Clear'), '🖐️');
      } catch (e) {}
      /* —— 结果面板 —— */
      lastResult = { win: true, isNew: isNew };
      renderResultLines();
      setTimeout(function () { resultEl.classList.add('show'); }, 500);
    }
  }
  function lose(boomIdx) {
    over = true; win = false;
    stopTimer();
    faceEl.textContent = '😵';
    for (var i = 0; i < cells.length; i++) {
      var c = cells[i];
      if (c.mine && !c.flag) { c.open = true; renderCell(i); }
      if (!c.mine && c.flag) { renderCell(i); cellEl(i).classList.add('wrong'); cellEl(i).textContent = '❌'; }
    }
    var be = cellEl(boomIdx);
    if (be) { be.textContent = '💥'; be.classList.add('boom'); }
    lastResult = { win: false, isNew: false };
    renderResultLines();
    setTimeout(function () { resultEl.classList.add('show'); }, 800);
  }

  /* ============ 结果面板文本（双语） ============ */
  var lastResult = null;
  function renderResultLines() {
    if (!lastResult) return;
    if (lastResult.win) {
      resultTitle.textContent = tr('🎉 排雷成功！');
      resultSub.textContent = isEn()
        ? (dname() + ' cleared · time ' + fmtTime(seconds) + ' s' + (lastResult.isNew ? ' · 🏆 New record!' : ''))
        : (dname() + '通关 · 用时 ' + fmtTime(seconds) + ' 秒' + (lastResult.isNew ? ' · 🏆 新纪录！' : ''));
    } else {
      resultTitle.textContent = tr('💥 踩到雷了');
      resultSub.textContent = isEn()
        ? ('Don\'t give up — try ' + dname() + ' again~')
        : ('别灰心，' + dname() + '再试一次～');
    }
  }
  function renderFlagBtn() {
    var on = isEn() ? '🚩 Flag mode: ON' : '🚩 插旗模式：开';
    var off = isEn() ? '🚩 Flag mode: OFF' : '🚩 插旗模式：关';
    flagModeBtn.textContent = flagMode ? on : off;
  }

  /* ============ 插旗 ============ */
  function toggleFlag(i) {
    if (over) return;
    var c = cells[i];
    if (c.open) return;
    c.flag = !c.flag;
    flagCount += c.flag ? 1 : -1;
    mineNumEl.textContent = String(mines - flagCount);
    renderCell(i);
  }

  /* ============ 双击快速展开（chord） ============ */
  function chord(i) {
    if (over) return;
    var c = cells[i];
    if (!c.open || c.num <= 0 || c.mine) return;
    var ns = neighbors(i), flagged = 0;
    for (var k = 0; k < ns.length; k++) if (cells[ns[k]].flag) flagged++;
    if (flagged !== c.num) return;
    for (var j = 0; j < ns.length; j++) {
      var n = ns[j];
      if (!cells[n].open && !cells[n].flag) {
        if (cells[n].mine) { lose(n); return; }
        floodOpen(n);
      }
    }
    checkWin();
  }

  /* ============ 交互 ============ */
  var longPressTimer = null, longPressFired = false, touchStartXY = null;

  board.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    var t = e.target.closest('.cell');
    if (!t) return;
    toggleFlag(parseInt(t.getAttribute('data-i'), 10));
  });

  board.addEventListener('click', function (e) {
    var t = e.target.closest('.cell');
    if (!t) return;
    var i = parseInt(t.getAttribute('data-i'), 10);
    if (suppressClick) { suppressClick = false; return; }
    if (flagMode) { toggleFlag(i); return; }
    openCell(i);
  });

  board.addEventListener('dblclick', function (e) {
    var t = e.target.closest('.cell');
    if (!t) return;
    chord(parseInt(t.getAttribute('data-i'), 10));
  });

  board.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    var t = e.target.closest('.cell');
    if (!t) return;
    longPressFired = false;
    var i = parseInt(t.getAttribute('data-i'), 10);
    touchStartXY = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(function () {
      longPressFired = true;
      suppressClick = true;
      toggleFlag(i);
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e2) {} }
    }, 420);
  }, { passive: true });

  board.addEventListener('touchmove', function (e) {
    if (!touchStartXY || e.touches.length !== 1) return;
    var dx = e.touches[0].clientX - touchStartXY.x;
    var dy = e.touches[0].clientY - touchStartXY.y;
    if (dx * dx + dy * dy > 100) { clearTimeout(longPressTimer); touchStartXY = null; }
  }, { passive: true });

  board.addEventListener('touchend', function () {
    clearTimeout(longPressTimer);
    if (longPressFired) { suppressClick = true; }
    touchStartXY = null;
  });

  window.addEventListener('resize', function () { fitCell(); });

  /* ============ 按钮 ============ */
  faceEl.addEventListener('click', function () { newGame(diff); });
  document.getElementById('againBtn').addEventListener('click', function () { newGame(diff); });
  document.getElementById('diffs').addEventListener('click', function (e) {
    var b = e.target.closest('.diff');
    if (!b) return;
    newGame(b.getAttribute('data-diff'));
  });
  flagModeBtn.addEventListener('click', function () {
    flagMode = !flagMode;
    flagModeBtn.classList.toggle('on', flagMode);
    renderFlagBtn();
  });

  /* 语言切换：刷新动态文本 */
  try {
    if (window.I18N && I18N.onChange) {
      I18N.onChange(function () {
        renderFlagBtn();
        if (resultEl.classList.contains('show')) renderResultLines();
      });
    }
  } catch (e) {}

  /* ============ 启动 ============ */
  renderBest();
  renderFlagBtn();
  newGame('easy');

  /* 测试钩子（仅调试用） */
  window.__saolei = {
    state: function () { return { rows: rows, cols: cols, mines: mines, diff: diff, started: started, over: over, win: win, opened: openedCount, flags: flagCount, seconds: seconds }; },
    cell: function (i) { var c = cells[i]; return c ? { mine: c.mine, open: c.open, flag: c.flag, num: c.num } : null; },
    open: function (i) { openCell(i); },
    flag: function (i) { toggleFlag(i); },
    chord: function (i) { chord(i); },
    newGame: function (d) { newGame(d); },
    board: function () { return board; }
  };
})();
</script>
</body>
</html>
