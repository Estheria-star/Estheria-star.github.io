    function resize() {
      if (!cv) return;
      cv.width = Math.round(window.innerWidth * dpr);

    function kick() { if (rafId == null && cv) { lastT = 0; rafId = requestAnimationFrame(frame); } }
    function frame(now) {
      rafId = null;
      var dt = lastT ? Math.min(80, now - lastT) : 16;
      lastT = now;
      step(dt);
      paint(now);
      if (effs.length || parts.length || enabled) kick();
      else { if (ctx) { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); } lastT = 0; }
    }
    function step(dt) {
      for (var i = effs.length - 1; i >= 0; i--) {
        var e = effs[i];
        e.t += dt;
        if (e.t >= e.life) effs.splice(i, 1);

      for (var j = parts.length - 1; j >= 0; j--) {
        var p = parts[j];
        p.t += dt;
        if (p.t >= p.life) { parts.splice(j, 1); continue; }
        var f = Math.max(0, 1 - p.drag * dt / 1000);

    /* ---- 基础工具 ---- */
    function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
    function ap(t, t0, dur) { return clamp01((t - t0) / dur); }

    /* ---- 发光描边核心（shadowBlur 光晕）---- */
    function stroke(path, color, glowC, blur, lw, alpha, dash, off) {
      ctx.save();
      ctx.globalAlpha = clamp01(alpha);

      ctx.lineWidth = lw;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      ctx.restore();

    function ring(x, y, r, color, glowC, blur, lw, alpha, dash, off) {

    }
    function poly(x, y, R, n, rot, color, glowC, blur, lw, alpha) {
      if (R <= 0 || alpha <= 0.003) return;
      stroke(function () {
        for (var i = 0; i <= n; i++) {

    function starPoly(x, y, R, n, step, rot, color, glowC, blur, lw, alpha) {

    function ticks(x, y, r, n, majorEvery, len, color, glowC, blur, lw, alpha, rot) {

          var c = Math.cos(a), s = Math.sin(a);

          ctx.lineTo(x + c * (r + L), y + s * (r + L));

    }
    function rays(x, y, r0, r1, n, rot, color, glowC, blur, lw, alpha) {
      if (alpha <= 0.003 || r1 <= r0) return;
      stroke(function () {
        for (var i = 0; i < n; i++) {
          var a = rot + i * TAU / n;
          var c = Math.cos(a), s = Math.sin(a);

    var GLYPHS = [
      [[-0.45, -0.9], [0.15, -0.15], [0.5, 0.9]],
      [[0, -0.95], [0, 0.95], [-0.5, 0.35], [0.5, 0.35]],
      [[-0.5, -0.7], [0.5, -0.7], [0, 0], [-0.5, 0.7], [0.5, 0.7]],
      [[0, -0.9], [0.55, 0], [0, -0.25], [-0.55, 0], [0, 0.9]],
      [[-0.55, 0.75], [-0.55, -0.75], [0.55, -0.75], [0.55, 0.1]],
      [[-0.45, -0.75], [0.45, -0.75], [0.45, 0.75], [-0.45, 0.75], [-0.45, -0.75]],
      [[0, -0.8], [-0.5, 0.7], [0.5, 0.7], [-0.28, 0.06], [0.28, 0.06]],
      [[-0.6, -0.6], [0.6, 0.6], [0.6, -0.6], [-0.6, 0.6]]

    function runes(x, y, r, count, rot, size, alpha) {

          ctx.moveTo(gx + (g[0][0] * ca - g[0][1] * sa) * size, gy + (g[0][0] * sa + g[0][1] * ca) * size);
          for (p = 1; p < g.length; p++) {
            ctx.lineTo(gx + (g[p][0] * ca - g[p][1] * sa) * size, gy + (g[p][0] * sa + g[p][1] * ca) * size);

        for (i = 1; i < count; i++) {

          ca = Math.cos(a + Math.PI / 2); sa = Math.sin(a + Math.PI / 2);
          g = GLYPHS[i % GLYPHS.length];
          gx = x + c * r; gy = y + s * r;
          ctx.moveTo(gx + (g[0][0] * ca - g[0][1] * sa) * size, gy + (g[0][0] * sa + g[0][1] * ca) * size);
          for (p = 1; p < g.length; p++) {

    function backGlow(x, y, r, alpha, color) {

        var a = Math.random() * TAU;
        var sp = 50 + Math.random() * 130;

          x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 24,
          g: 30, drag: 2.3, r: 1.3 + Math.random() * 1.7,

    /* ---- 主循环绘制 ---- */
    function paint(now) {
      if (!ctx) return;

        var r = p.r * (1 - k * 0.55);

    }
    function paintAmbient(now) {
      var rct = board.getBoundingClientRect();
      if (rct.bottom < -40 || rct.top > window.innerHeight + 40) return;
      if (rct.right < 0 || rct.left > window.innerWidth) return;
      var cx = rct.left + rct.width / 2, cy = rct.top + rct.height / 2;
      var R = Math.max(110, Math.min(340, Math.min(rct.width, rct.height) * 0.42));

      starPoly(cx, cy, R * 0.88, 12, 5, t * 0.05, C.vioLt, C.vioLt, 0, 1, 0.05);
      var a3 = t * 0.55;

      }
    }

    /* ---- 各效果 ---- */
    function paintEff(e) {
      if (e.kind === 'mini') return effMini(e);
      if (e.kind === 'seal') return effSeal(e);
      if (e.kind === 'chord') return effChord(e);
      if (e.kind === 'flagOn' || e.kind === 'flagOff') return effFlag(e);
      if (e.kind === 'grand') return effGrand(e);
      if (e.kind === 'dark') return effDark(e);
    }

    /* 小封印：单元格翻开 */
    function effMini(e) {
      var t = e.t, x = e.x, y = e.y, R = e.R;
      var g = Math.min(1.12, easeOutBack(ap(t, 0, 330)));
      var a = alphaPulse(t, e.life, 90, 460);
      if (a <= 0.01) return;
      var r = R * (0.5 + 0.5 * Math.max(0.01, g));
      backGlow(x, y, r * 2.3, 0.15 * a, C.vio);
      ring(x, y, r, C.vio, C.vioLt, 14, 1.3, 0.85 * a);
      poly(x, y, r * 0.72, 3, t * 0.0011 - Math.PI / 2, C.cyan, C.cyanLt, 12, 1.2, 0.8 * a);
      poly(x, y, r * 0.72, 3, t * 0.0011 + Math.PI / 2, C.cyan, C.cyanLt, 12, 1.2, 0.8 * a);
      coreOrb(x, y, r * 0.34 * (0.82 + 0.18 * Math.sin(t * 0.01)), 0.72 * a);
      if (t < 200 && !e._s) { e._s = 1; sparkBurst(x, y, 7, [C.vioLt, C.cyanLt]); }
    }

    /* 大封印：泛洪展开 */
    function effSeal(e) {
      var t = e.t, x = e.x, y = e.y, R = e.R;
      var g = easeOut(ap(t, 0, 430));
      var a = alphaPulse(t, e.life, 120, 640);
      if (a <= 0.01) return;
      var r = R * (0.5 + 0.5 * g);
      backGlow(x, y, r * 2.4, 0.2 * a, C.vio);
      ring(x, y, r * 1.12, C.vio, C.vioLt, 18, 1.5, 0.8 * a);
      ticks(x, y, r * 1.02, 40, 5, r * 0.045, C.cyan, C.cyanLt, 10, 1, 0.5 * a, -t * 0.0007);

      poly(x, y, r * 0.55, 3, -t * 0.0012 - Math.PI / 2, C.cyan, C.cyanLt, 12, 1.2, 0.75 * a);
      poly(x, y, r * 0.55, 3, -t * 0.0012 + Math.PI / 2, C.cyan, C.cyanLt, 12, 1.2, 0.75 * a);
      ring(x, y, r * 0.28, C.vio, C.vioLt, 10, 1, 0.66 * a, [3, 6], t * 0.004);
      coreOrb(x, y, r * 0.3, 0.68 * a);
      if (t < 260 && !e._s) { e._s = 1; sparkBurst(x, y, 14, [C.vioLt, C.cyanLt, C.white]); }
    }

    /* 双击展开：双环星纹 */
    function effChord(e) {
      var t = e.t, x = e.x, y = e.y, R = e.R;
      var g = easeOut(ap(t, 0, 280));
      var a = alphaPulse(t, e.life, 70, 420);
      if (a <= 0.01) return;
      var r = R * (0.55 + 0.45 * g);
      backGlow(x, y, r * 2, 0.14 * a, C.cyan);
      ring(x, y, r * 1.05, C.cyan, C.cyanLt, 14, 1.3, 0.8 * a);
      starPoly(x, y, r * 0.8, 7, 2, t * 0.0012, C.vioLt, C.vioLt, 12, 1.2, 0.8 * a);
      poly(x, y, r * 0.5, 3, -t * 0.0016 - Math.PI / 2, C.cyan, C.cyanLt, 10, 1.1, 0.7 * a);
      poly(x, y, r * 0.5, 3, -t * 0.0016 + Math.PI / 2, C.cyan, C.cyanLt, 10, 1.1, 0.7 * a);
      coreOrb(x, y, r * 0.24, 0.6 * a);
      if (t < 180 && !e._s) { e._s = 1; sparkBurst(x, y, 8, [C.cyanLt, C.vioLt]); }
    }

    /* 插旗 / 撤旗 */
    function effFlag(e) {
      var on = e.kind === 'flagOn';
      var t = e.t, x = e.x, y = e.y, R = e.R;
      var a = on ? alphaPulse(t, e.life, 60, 300) : (1 - t / e.life) * 0.7;
      if (a <= 0.01) return;

      }
    }

    /* ★ 超位魔法（胜利）★ */
    function effGrand(e) {
      var t = e.t, x = e.x, y = e.y, R = e.R;
      var out = outAlpha(t, e.life, 5300);

      /* 3 虚线圈（青） */
      if (g2 > 0.05) ring(x, y, R * 1.1 * (0.2 + 0.8 * g2), C.cyan, C.cyanLt, 12, 1.2, 0.55 * out * g2, [2, 10], th * 26);
      /* 4 刻度环 */
      if (g3 > 0.05) ticks(x, y, R * (0.2 + 0.8 * g3), 60, 5, R * 0.03, C.cyan, C.cyanLt, 10, 1, 0.5 * out, th * 0.5);

        poly(x, y, rs, 3, -th * 1.2 - Math.PI / 2, C.cyan, C.cyanLt, 16, 1.4, 0.78 * out);
        poly(x, y, rs, 3, -th * 1.2 + Math.PI / 2, C.cyan, C.cyanLt, 16, 1.4, 0.78 * out);
      }
      /* 7 内环 + 核心 */
      ring(x, y, R * 0.4, C.vio, C.vioLt, 12, 1, 0.6 * out, [3, 7], -th * 4);
      coreOrb(x, y, R * 0.34 * (0.85 + 0.15 * Math.sin(t * 0.007)), 0.8 * out * ap(t, 300, 700));
      /* 8 斜向光柱 */
      var rayA = ap(t, 2600, 900) * out;
      if (rayA > 0.02) rays(x, y, R * 0.15, R * 1.5, 4, th * 0.35, C.vioLt, C.vioLt, 10, 1, 0.2 * rayA * (0.7 + 0.3 * Math.sin(t * 0.004)));

      if (orbA > 0.02) {
        for (var i = 0; i < 12; i++) {
          var ang = -th * 1.6 + i * TAU / 12;
          var rr = R * 1.16;
          var flick = 0.6 + 0.4 * Math.sin(t * 0.006 + i * 2.1);
          dot(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr, i % 3 === 0 ? 2.6 : 1.8, i % 3 === 0 ? C.cyanLt : C.vioLt, orbA * flick * 0.9);

        if (diff === 'hard') STAch.unlock('saolei.win_hard', achName('高级排雷专家', 'Expert Deminer'), '🏅');
        if (diff === 'easy' && seconds <= 60) STAch.unlock('saolei.speed', achName('闪电排雷', 'Lightning Clear'), '⚡');
        if (playerFlagCount === 0) STAch.unlock('saolei.noflag', achName('徒手排雷', 'Flagless Clear'), '🖐️');
      } catch (e) {}
      /* —— 超位魔法（胜利特效）—— */
      var bcW = boardCenter();
      FX.clear();
      FX.grand(bcW.x, bcW.y, bcW.R, tr('超位魔法 · 全图排雷'));
      /* —— 结果面板 —— */
      lastResult = { win: true, isNew: isNew };
      renderResultLines();
      setTimeout(function () { resultEl.classList.add('show'); }, 500);
    }
  }
  function lose(boomIdx) {
    over = true; win = false;
    stopTimer();
    faceEl.textContent = '😵';
    for (var i = 0; i < cells.length; i++) {
      var c = cells[i];
      if (c.mine && !c.flag) { c.open = true; renderCell(i); }
      if (!c.mine && c.flag) { renderCell(i); cellEl(i).classList.add('wrong'); cellEl(i).textContent = '❌'; }
    }
    var be = cellEl(boomIdx);
    if (be) { be.textContent = '💥'; be.classList.add('boom'); }
    var bpD = cellCenter(boomIdx), bdD = boardCenter();
    FX.clear();
    FX.dark(bpD ? bpD.x : bdD.x, bpD ? bpD.y : bdD.y, bdD.R);
    lastResult = { win: false, isNew: false };
    renderResultLines();
    setTimeout(function () { resultEl.classList.add('show'); }, 800);
  }

  /* ============ 结果面板文本（双语） ============ */
  var lastResult = null;
  function renderResultLines() {
    if (!lastResult) return;
    if (lastResult.win) {
      resultTitle.textContent = tr('🎉 排雷成功！');
      resultSub.textContent = isEn()
        ? (dname() + ' cleared · time ' + fmtTime(seconds) + ' s' + (lastResult.isNew ? ' · 🏆 New record!' : ''))
        : (dname() + '通关 · 用时 ' + fmtTime(seconds) + ' 秒' + (lastResult.isNew ? ' · 🏆 新纪录！' : ''));
    } else {
      resultTitle.textContent = tr('💥 踩到雷了');
      resultSub.textContent = isEn()
        ? ('Don\'t give up — try ' + dname() + ' again~')
        : ('别灰心，' + dname() + '再试一次～');
    }
  }
  function renderFlagBtn() {
    var on = isEn() ? '🚩 Flag mode: ON' : '🚩 插旗模式：开';
    var off = isEn() ? '🚩 Flag mode: OFF' : '🚩 插旗模式：关';
    flagModeBtn.textContent = flagMode ? on : off;
  }

  /* ============ 插旗 ============ */
  function toggleFlag(i) {
    if (over) return;
    var c = cells[i];
    if (c.open) return;
    c.flag = !c.flag;
    flagCount += c.flag ? 1 : -1;
    mineNumEl.textContent = String(mines - flagCount);
    renderCell(i);
    var cc2 = cellCenter(i);
    if (cc2) FX.flag(cc2.x, cc2.y, c.flag);
  }

  /* ============ 双击快速展开（chord） ============ */
  function chord(i) {
    if (over) return;
    var c = cells[i];
    if (!c.open || c.num <= 0 || c.mine) return;
    var ns = neighbors(i), flagged = 0;
    for (var k = 0; k < ns.length; k++) if (cells[ns[k]].flag) flagged++;
    if (flagged !== c.num) return;
    var beforeC = openedCount;
    for (var j = 0; j < ns.length; j++) {
      var n = ns[j];
      if (!cells[n].open && !cells[n].flag) {
        if (cells[n].mine) { lose(n); return; }
        floodOpen(n);
      }
    }
    var deltaC = openedCount - beforeC;
    if (deltaC > 0) {
      var cc1 = cellCenter(i);
      if (cc1) { if (deltaC >= 8) FX.seal(cc1.x, cc1.y); else FX.chord(cc1.x, cc1.y); }
    }
    checkWin();
  }

  /* ============ 交互 ============ */
  var longPressTimer = null, longPressFired = false, touchStartXY = null;

  board.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    var t = e.target.closest('.cell');
    if (!t) return;
    toggleFlag(parseInt(t.getAttribute('data-i'), 10));
  });

  board.addEventListener('click', function (e) {
    var t = e.target.closest('.cell');
    if (!t) return;
    var i = parseInt(t.getAttribute('data-i'), 10);
    if (suppressClick) { suppressClick = false; return; }
    if (flagMode) { toggleFlag(i); return; }
    openCell(i);
  });

  board.addEventListener('dblclick', function (e) {
    var t = e.target.closest('.cell');
    if (!t) return;
    chord(parseInt(t.getAttribute('data-i'), 10));
  });

  board.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    var t = e.target.closest('.cell');
    if (!t) return;
    longPressFired = false;
    var i = parseInt(t.getAttribute('data-i'), 10);
    touchStartXY = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(function () {
      longPressFired = true;
      suppressClick = true;
      toggleFlag(i);
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e2) {} }
    }, 420);
  }, { passive: true });

  board.addEventListener('touchmove', function (e) {
    if (!touchStartXY || e.touches.length !== 1) return;
    var dx = e.touches[0].clientX - touchStartXY.x;
    var dy = e.touches[0].clientY - touchStartXY.y;
    if (dx * dx + dy * dy > 100) { clearTimeout(longPressTimer); touchStartXY = null; }
  }, { passive: true });

  board.addEventListener('touchend', function () {
    clearTimeout(longPressTimer);
    if (longPressFired) { suppressClick = true; }
    touchStartXY = null;
  });

  window.addEventListener('resize', function () { fitCell(); });

  /* ============ 按钮 ============ */
  faceEl.addEventListener('click', function () { newGame(diff); });
  document.getElementById('againBtn').addEventListener('click', function () { newGame(diff); });
  /* ---- 自定义难度面板 ---- */
  var customPanel = document.getElementById('customPanel');
  var cpRows = document.getElementById('cpRows');
  var cpCols = document.getElementById('cpCols');
  var cpMines = document.getElementById('cpMines');
  var cpSeed = document.getElementById('cpSeed');
  var cpHint = document.getElementById('cpHint');
  function updateCpHint() {
    var r = Math.min(CP_RANGE.rowsMax, Math.max(CP_RANGE.rowsMin, parseInt(cpRows.value, 10) || DIFFS.custom.rows));
    var c = Math.min(CP_RANGE.colsMax, Math.max(CP_RANGE.colsMin, parseInt(cpCols.value, 10) || DIFFS.custom.cols));
    var maxM = Math.max(1, r * c - 9);
    cpHint.textContent = (isEn()
      ? ('Rows ' + CP_RANGE.rowsMin + '–' + CP_RANGE.rowsMax + ' · Cols ' + CP_RANGE.colsMin + '–' + CP_RANGE.colsMax + ' · Mines 1–' + maxM)
      : ('行 ' + CP_RANGE.rowsMin + '–' + CP_RANGE.rowsMax + ' · 列 ' + CP_RANGE.colsMin + '–' + CP_RANGE.colsMax + ' · 雷 1–' + maxM))
      + (isEn() ? ' · shareable via link' : ' · 支持链接分享');
  }
  function openCustomPanel() {
    cpRows.value = DIFFS.custom.rows;
    cpCols.value = DIFFS.custom.cols;
    cpMines.value = DIFFS.custom.mines;
    /* 正在玩自定义局 → 种子字段同步当前局的（方便「分享这局」） */
    if (diff === 'custom' && gameSeed !== null) cpSeed.value = gameSeed;
    updateCpHint();
    customPanel.classList.add('show');
  }
  function closeCustomPanel() { customPanel.classList.remove('show'); }
  function startCustom() {
    var c = customClamp(cpRows.value, cpCols.value, cpMines.value);
    DIFFS.custom.rows = c.rows; DIFFS.custom.cols = c.cols; DIFFS.custom.mines = c.mines;
    cpRows.value = c.rows; cpCols.value = c.cols; cpMines.value = c.mines;
    var sv = parseInt(cpSeed.value, 10);
    if (!isNaN(sv) && sv > 0) gameSeed = sv;
    else { gameSeed = genSeed(); cpSeed.value = gameSeed; }
    try { localStorage.setItem(CUSTOM_KEY, JSON.stringify({ rows: c.rows, cols: c.cols, mines: c.mines })); } catch (e) {}
    closeCustomPanel();
    newGame('custom');
    var bcC = boardCenter();
    FX.seal(bcC.x, bcC.y);
  }
  document.getElementById('cpStart').addEventListener('click', startCustom);
  document.getElementById('cpCancel').addEventListener('click', closeCustomPanel);

  /* ---- 分享雷局：链接携带 行/列/雷/种子；同一种子 + 同一首击 = 同一片雷 ---- */
  function buildShareUrl(r, c, m, sd) {
    var base = (location.protocol === 'http:' || location.protocol === 'https:')
      ? location.origin + location.pathname
      : 'https://startian.top/saolei/';
    return base + '#r=' + r + '&c=' + c + '&m=' + m + '&s=' + sd;
  }
  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(t).catch(function () {});
    }
    return new Promise(function (resolve) {
      try {
        var ta = document.createElement('textarea');
        ta.value = t; ta.style.cssText = 'position:fixed;left:-9999px;top:0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e) {}
      resolve();
    });
  }
  function shareToast() {
    toast(isEn() ? 'Link copied — challenge your friends!' : '链接已复制，发给大家来挑战吧～');
  }
  document.getElementById('cpDice').addEventListener('click', function () { cpSeed.value = genSeed(); });
  document.getElementById('cpShare').addEventListener('click', function () {
    var c = customClamp(cpRows.value, cpCols.value, cpMines.value);
    cpRows.value = c.rows; cpCols.value = c.cols; cpMines.value = c.mines;
    var sv = parseInt(cpSeed.value, 10);
    if (isNaN(sv) || sv <= 0) { sv = genSeed(); cpSeed.value = sv; }
    updateCpHint();
    copyText(buildShareUrl(c.rows, c.cols, c.mines, sv)).then(shareToast);
  });
  var shareCurBtn = document.getElementById('shareCur');
  shareCurBtn.addEventListener('click', function () {
    var sd = (gameSeed !== null) ? gameSeed : genSeed();
    copyText(buildShareUrl(rows, cols, mines, sd)).then(shareToast);
  });
  function renderTools() {
    shareCurBtn.classList.toggle('hidden', diff !== 'custom');
    shareCurBtn.textContent = tr('🔗 分享这局');
  }
  [cpRows, cpCols, cpMines].forEach(function (inp) {
    inp.addEventListener('input', updateCpHint);
    inp.addEventListener('change', function () {
      var c = customClamp(cpRows.value, cpCols.value, cpMines.value);
      cpRows.value = c.rows; cpCols.value = c.cols; cpMines.value = c.mines;
      updateCpHint();
    });
  });

  document.getElementById('diffs').addEventListener('click', function (e) {
    var b = e.target.closest('.diff');
    if (!b) return;
    var d = b.getAttribute('data-diff');
    if (d === 'custom') {
      if (customPanel.classList.contains('show')) closeCustomPanel();
      else openCustomPanel();
      return;
    }
    closeCustomPanel();
    newGame(d);
  });
  flagModeBtn.addEventListener('click', function () {
    flagMode = !flagMode;
    flagModeBtn.classList.toggle('on', flagMode);
    renderFlagBtn();
  });

  /* ---- ✨ 魔法特效开关（默认关闭）---- */
  var fxToggleBtn = document.getElementById('fxToggle');
  function renderFxBtn() {
    var on = FX.isOn();
    fxToggleBtn.classList.toggle('on', on);
    fxToggleBtn.textContent = on ? tr('✨ 特效：开') : tr('✨ 特效：关');
  }
  fxToggleBtn.addEventListener('click', function () {
    var on = FX.set(!FX.isOn());
    renderFxBtn();
    if (on) {
      FX.demo(window.innerWidth / 2, Math.max(120, window.innerHeight * 0.38));
      toast(tr('✨ 魔法特效已点亮'));
    } else {
      toast(tr('特效已关闭'));
    }
  });

  /* 语言切换：刷新动态文本 */
  try {
    if (window.I18N && I18N.onChange) {
      I18N.onChange(function () {
        renderFlagBtn();
        renderFxBtn();
        renderTools();
        if (customPanel.classList.contains('show')) updateCpHint();
        if (resultEl.classList.contains('show')) renderResultLines();
      });
    }
  } catch (e) {}

  /* ============ 启动 ============ */
  renderBest();
  renderFlagBtn();
  renderTools();
  FX.init();
  renderFxBtn();
  newGame('easy');

  /* ---- 分享链接载入（#r=..&c=..&m=..&s=..）---- */
  (function loadShared() {
    try {
      var q = {};
      (location.hash || '').replace(/^#/, '').split('&').forEach(function (kv) {
        var a = kv.split('=');
        if (a[0]) q[a[0]] = a[1];
      });
      if (!q.r || !q.c || !q.m) return;
      var cc = customClamp(q.r, q.c, q.m);
      DIFFS.custom.rows = cc.rows; DIFFS.custom.cols = cc.cols; DIFFS.custom.mines = cc.mines;
      var sv = parseInt(q.s, 10);
      gameSeed = (!isNaN(sv) && sv > 0) ? sv : genSeed();
      cpRows.value = cc.rows; cpCols.value = cc.cols; cpMines.value = cc.mines; cpSeed.value = gameSeed;
      newGame('custom');
      setTimeout(function () {
        toast(isEn()
          ? ('Shared minefield loaded: ' + cc.rows + '×' + cc.cols + ' · ' + cc.mines + ' mines' + (q.s ? (' · seed ' + gameSeed) : ''))
          : ('已载入分享的雷局：' + cc.rows + '×' + cc.cols + ' · ' + cc.mines + ' 雷' + (q.s ? (' · 种子 ' + gameSeed) : '')));
      }, 450);
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    } catch (e) {}
  })();

  /* 测试钩子（仅调试用） */
  window.__saolei = {
    state: function () { return { rows: rows, cols: cols, mines: mines, diff: diff, started: started, over: over, win: win, opened: openedCount, flags: flagCount, seconds: seconds, seed: gameSeed }; },
    cell: function (i) { var c = cells[i]; return c ? { mine: c.mine, open: c.open, flag: c.flag, num: c.num } : null; },
    open: function (i) { openCell(i); },
    flag: function (i) { toggleFlag(i); },
    chord: function (i) { chord(i); },
    newGame: function (d) { newGame(d); },
    custom: function (r, c, m, sd) {
      var cc = customClamp(r, c, m);
      DIFFS.custom.rows = cc.rows; DIFFS.custom.cols = cc.cols; DIFFS.custom.mines = cc.mines;
      var sv = parseInt(sd, 10);
      gameSeed = (!isNaN(sv) && sv > 0) ? sv : genSeed();
      newGame('custom');
      return { rows: cc.rows, cols: cc.cols, mines: cc.mines, seed: gameSeed };
    },
    customCfg: function () { return { rows: DIFFS.custom.rows, cols: DIFFS.custom.cols, mines: DIFFS.custom.mines }; },
    fxState: function () { return FX.state(); },
    fxToggle: function () { var on = FX.set(!FX.isOn()); renderFxBtn(); return on; },
    fxGrand: function () { FX.set(true); var bc = boardCenter(); FX.clear(); FX.grand(bc.x, bc.y, bc.R, tr('超位魔法 · 全图排雷')); return FX.state(); },
    fxDark: function () { FX.set(true); var bc = boardCenter(); FX.clear(); FX.dark(bc.x, bc.y, bc.R); return FX.state(); },
    allMines: function () { var a = []; for (var i = 0; i < cells.length; i++) if (cells[i].mine) a.push(i); return a; },
    shareUrl: function () { return buildShareUrl(rows, cols, mines, (gameSeed !== null) ? gameSeed : genSeed()); },
    board: function () { return board; }
  };
})();
</script>
</body>
</html>
