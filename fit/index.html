<style>

  header{display:flex;align-items:center;gap:13px;padding:18px 24px;flex-wrap:wrap}
  header h1{font-size:19px;margin:0;letter-spacing:.5px}
  header .sub{font-size:12px;color:#7fb8a2;font-weight:600}
  .home{margin-left:auto;text-decoration:none;font-size:12.5px;font-weight:700;color:#c8f5e4;border:1px solid rgba(90,220,170,.3);border-radius:999px;padding:9px 16px;background:rgba(14,34,26,.7);transition:border-color .2s,transform .2s}

  main{max-width:1080px;margin:0 auto;padding:4px 24px 70px;display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}

  .card{background:rgba(16,36,28,.68);border:1px solid rgba(90,220,170,.22);border-radius:22px;padding:16px;box-shadow:0 18px 44px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}

<header>
  <h1>📈 函数拟合器</h1>
  <span class="sub">丢一堆散点进去 · 自动找出最像的函数</span>

</header>
<main>
  <section class="card">
    <h2>SCATTER · 散点画布</h2>
    <canvas id="plot"></canvas>
    <div class="btns">
      <button class="primary" id="btnLin" type="button">🎲 撒线性点</button>
      <button id="btnQuad" type="button">🎲 撒抛物线点</button>
      <button id="btnExp" type="button">🎲 撒指数点</button>
      <button id="btnClear" type="button">🧹 清空</button>
    </div>
    <p class="tip">点击画布加点 · 右键删除最近的点 · 也可以在下面粘贴数据（每行 x,y 或 x y）</p>
    <div class="data-row">
      <textarea id="dataIn" placeholder="1,2.1&#10;2,3.9&#10;3,6.2&#10;4,8.1&#10;5,9.8"></textarea>
      <button id="btnParse" type="button">导入<br>数据</button>
    </div>
  </section>
  <section class="card">
    <h2>FIT · 拟合结果（实时）</h2>
    <div class="fits" id="fits"></div>
    <p class="tip" id="fitTip" style="margin-top:12px">至少需要 2 个点，多撒几个效果更明显。金色边框 = 当前最像的函数。</p>
  </section>
</main>

/* ==== i18n-kit v1.2 begin ==== */
/* ══════════════════════════════════════════════════════════

   · 语言：zh（默认）/ en；跨站同步 cookie st_lang(.startian.top) + localStorage 兜底
   · 自动识别：首次访问按 navigator.language（zh 开头 → 中文，其余 → English）
   · 两种接入模式（可混用）：
     ① 短语表模式（推荐，低侵入）：I18N.phrase({ '中文原文': 'English', ... })
        自动扫描文本节点 / title / placeholder / aria-label / alt，动态插入的文本也自动翻译

   · API：I18N.t(k[,vars]) · I18N.tOr(k,fb) · I18N.tr(原文) · I18N.set(lang) · I18N.lang()
          · I18N.phrase(map) · I18N.scan(root) · I18N.apply(root) · I18N.onChange(fn)
          · I18N.fmtDate(date[,{weekday:true}]) · I18N.fmtNum(n)

   ══════════════════════════════════════════════════════════ */
var I18N = (function () {
  'use strict';
  var LS = 'st_lang';
  var FALLBACK = 'zh';
  var lang = FALLBACK;
  var dict = { zh: {}, en: {} };
  var phrase = {};      /* 短语表：中文原文（归一化）→ 译文 */
  var listeners = [];
  var bd = {};          /* boot data：原文快照等 */

  /* ---- 基础词典（全站通用词条） ---- */
  dict.zh['common.home'] = '主页';
  dict.en['common.home'] = 'Home';
  dict.zh['common.homeTitle'] = '返回星恬的小站主页';
  dict.en['common.homeTitle'] = "Back to Startian's homepage";
  dict.zh['common.close'] = '关闭';
  dict.en['common.close'] = 'Close';
  dict.zh['common.cancel'] = '取消';
  dict.en['common.cancel'] = 'Cancel';

  /* ---- 存储与识别 ---- */
  function norm(v) {
    v = String(v || '').toLowerCase();
    if (v.indexOf('zh') === 0) return 'zh';

    catch (e) { return null; }

    try { localStorage.setItem(LS, v); } catch (e) {}
    try { document.cookie = 'st_lang=' + encodeURIComponent(v) + ';domain=.startian.top;path=/;max-age=31536000;SameSite=Lax'; } catch (e) {}
  }
  function detect() {
    var s = norm(readCookie()) || norm(readLS());

    var n = norm(navigator.language || navigator.userLanguage);

  var WD_ZH = '日一二三四五六';
  var WD_EN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  function fmtDate(d, opt) {

    } else {
      s = MN_EN[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
      if (opt.weekday) s += ' · ' + WD_EN[d.getDay()];

    return s;
  }
  function fmtNum(n) {
    try { return Number(n).toLocaleString(lang === 'zh' ? 'zh-CN' : 'en-US'); }
    catch (e) { return String(n); }
  }

    try {
      var i, list, v, el;

        v = tRaw(el.getAttribute('data-i18n-html'));

  /* ============ 交互 ============ */
  function fitOnce() {
    if (pts.length >= 2 && !fitOnce._done) {
      fitOnce._done = true;
      try { STAch.unlock('fit.fit', '找到最像的那个', '🧮'); } catch (e) {}
    }
  }
  var lastFitCheck = 0;
  function afterChange() {
    draw();
    if (pts.length >= 2 && performance.now() - lastFitCheck > 600) {
      lastFitCheck = performance.now();
      fitOnce();
    }
  }
  function fit() {
    var W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    afterChange();
  }
  window.addEventListener('resize', fit);

  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  cv.addEventListener('pointerdown', function (e) {
    var r = cv.getBoundingClientRect();
    if (e.button === 2) {
      /* 删除最近点 */
      var B = bounds();
      var d = toData((e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr, B);
      var bi = -1, bd = 1e9;
      pts.forEach(function (p, i) {
        var dd = Math.hypot(p.x - d.x, p.y - d.y);
        if (dd < bd) { bd = dd; bi = i; }
      });
      if (bi >= 0) pts.splice(bi, 1);
    } else {
      var B2 = bounds();
      pts.push(toData((e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr, B2));
    }
    afterChange();
  });

  function rand(gen, n) {
    pts = [];
    for (var i = 0; i < n; i++) {
      var x = -5 + i * 10 / (n - 1);
      pts.push({ x: x, y: gen(x) + (Math.random() - 0.5) * 2.4 });
    }
    afterChange();
  }
  document.getElementById('btnLin').addEventListener('click', function () { rand(function (x) { return 1.4 * x + 2.2; }, 11); toast('🎲 撒了一把线性点'); });
  document.getElementById('btnQuad').addEventListener('click', function () { rand(function (x) { return 0.6 * x * x - 1.2 * x + 1; }, 13); toast('🎲 撒了一把抛物线点'); });
  document.getElementById('btnExp').addEventListener('click', function () { rand(function (x) { return 1.6 * Math.exp(0.42 * x); }, 11); toast('🎲 撒了一把指数点'); });
  document.getElementById('btnClear').addEventListener('click', function () { pts = []; afterChange(); });
  document.getElementById('btnParse').addEventListener('click', function () {
    var lines = document.getElementById('dataIn').value.split('\n');
    var got = [];
    lines.forEach(function (ln) {
      var m = ln.trim().split(/[,\s;，]+/).map(parseFloat);
      if (m.length >= 2 && isFinite(m[0]) && isFinite(m[1])) got.push({ x: m[0], y: m[1] });
    });
    if (!got.length) { toast('没认出数据…每行写成 1,2.1 这种'); return; }
    pts = got;
    afterChange();
    toast('📥 导入了 ' + got.length + ' 个点');
  });

  var toastEl = document.getElementById('toast'), toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  fit();
  /* 开场给一把示例数据 */
  rand(function (x) { return 0.6 * x * x - 1.2 * x + 1; }, 13);
})();
</script>

<script>/*st-pt-tracker*/
(function () {
  'use strict';
  try {
    var PROJ = 'fit';
    var host = location.hostname;
    if (host !== 'startian.top' && !/\.startian\.top$/.test(host)) return;
    var KEY = 'st_pt', DOMAIN = '.startian.top';
    var last = Date.now();
    function readMap() {
      var m = {};
      try {
        var parts = document.cookie.split(';');
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i].trim();
          if (p.indexOf(KEY + '=') === 0) {
            decodeURIComponent(p.slice(KEY.length + 1)).split('&').forEach(function (kv) {
              var a = kv.split('=');
              if (a[0]) m[a[0]] = parseInt(a[1], 10) || 0;
            });
            break;
          }
        }
      } catch (e) {}
      return m;
    }
    function flush() {
      var now = Date.now();
      var delta = Math.round((now - last) / 1000);
      last = now;
      if (delta < 5 || delta > 3600) return;
      var m = readMap();
      m[PROJ] = Math.min(99999999, (m[PROJ] || 0) + delta);
      var out = [];
      for (var k in m) out.push(k + '=' + m[k]);
      try {
        document.cookie = KEY + '=' + encodeURIComponent(out.join('&')) + '; domain=' + DOMAIN + '; path=/; max-age=63072000; SameSite=Lax';
      } catch (e) {}
    }
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') flush();
      else last = Date.now();
    });
    window.addEventListener('pagehide', flush);
    setInterval(function () { if (document.visibilityState === 'visible') flush(); }, 30000);
  } catch (e) {}
})();</script>
