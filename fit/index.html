<meta name="description" content="函数拟合器：丢一堆散点进去，从 11 种函数模型（多项式 / 指数 / 幂 / 对数 / 反比 / 正弦 / 高斯…）里自动找出最像的那个。startian.top 出品">

<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:radial-gradient(1100px 600px at 50% -80px, #14342a 0%, #0d211b 45%, #08130f 100%);color:#e8fff5;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif}
  header{display:flex;align-items:center;gap:13px;padding:18px 24px;flex-wrap:wrap}
  header h1{font-size:19px;margin:0;letter-spacing:.5px}
  header .sub{font-size:12px;color:#7fb8a2;font-weight:600}
  .home{margin-left:auto;text-decoration:none;font-size:12.5px;font-weight:700;color:#c8f5e4;border:1px solid rgba(90,220,170,.3);border-radius:999px;padding:9px 16px;background:rgba(14,34,26,.7);transition:border-color .2s,transform .2s}
  .home:hover{border-color:rgba(110,240,190,.7);transform:translateY(-1px)}
  main{max-width:1080px;margin:0 auto;padding:4px 24px 70px;display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
  @media (max-width:880px){ main{grid-template-columns:1fr} }
  .card{background:rgba(16,36,28,.68);border:1px solid rgba(90,220,170,.22);border-radius:22px;padding:16px;box-shadow:0 18px 44px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .card h2{margin:0 0 10px;font-size:12.5px;letter-spacing:2px;color:#7fb8a2;font-weight:800}
  #plot{width:100%;height:420px;display:block;border-radius:14px;background:rgba(6,16,12,.75);border:1px solid rgba(90,220,170,.18);cursor:crosshair;touch-action:none}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  button{
    border:1px solid rgba(90,220,170,.32);border-radius:999px;padding:9px 15px;font-size:12.5px;font-weight:800;
    font-family:inherit;cursor:pointer;color:#e8fff5;background:linear-gradient(180deg,rgba(50,200,150,.28),rgba(30,150,110,.24));
    transition:transform .15s ease,border-color .2s ease;
  }
  button:hover{border-color:rgba(110,240,190,.7);transform:translateY(-1px)}
  button.primary{background:linear-gradient(180deg,#3ddba0,#1b9e6e);color:#04211a;border-color:transparent;box-shadow:0 5px 0 #0f5f42,0 12px 24px rgba(40,200,150,.35)}
  .tip{font-size:11.5px;color:#7fb8a2;line-height:1.8;margin-top:10px}
  .fits{display:flex;flex-direction:column;gap:8px}
  .fit{border:1px solid rgba(90,220,170,.22);border-radius:14px;padding:10px 13px;background:rgba(10,26,20,.6);transition:border-color .25s ease,transform .25s ease}
  .fit.best{border-color:#3ddba0;background:linear-gradient(150deg,rgba(40,150,110,.3),rgba(20,80,60,.3));transform:translateY(-1px);box-shadow:0 10px 26px rgba(30,160,110,.25)}
  .fit .fn{font-family:ui-monospace,Consolas,monospace;font-size:13px;font-weight:700;color:#d9ffef;word-break:break-all}
  .fit .meta{display:flex;gap:10px;font-size:11px;color:#8fc9b2;margin-top:5px;font-weight:700}
  .fit.best .meta{color:#5ff0c0}
  .data-row{display:flex;gap:8px;margin-top:11px}
  .data-row textarea{flex:1;height:74px;resize:none;border:1.5px solid rgba(90,220,170,.28);border-radius:12px;padding:9px 11px;font-size:12px;font-family:ui-monospace,Consolas,monospace;color:#e8fff5;background:rgba(8,20,15,.7);outline:none}
  .data-row textarea:focus{border-color:#3ddba0}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);opacity:0;z-index:60;background:rgba(14,34,26,.95);border:1px solid rgba(90,220,170,.4);border-radius:999px;padding:11px 22px;font-size:13px;font-weight:700;transition:all .3s ease;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .btns .noise{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#7fb8a2;font-weight:800;margin-left:auto;padding:0 2px}
  .btns .noise input{width:92px;accent-color:#3ddba0;height:3px}
  .btns .noise b{color:#5ff0c0;min-width:24px;text-align:right;font-variant-numeric:tabular-nums}
/* —— 返回主页（全站统一 · 2026-09-29）—— */
.wb-home{position:fixed;left:14px;bottom:14px;z-index:9990;display:inline-flex;align-items:center;gap:5px;
  padding:8px 13px 8px 10px;border-radius:999px;text-decoration:none;
  background:rgba(17,24,39,.55);color:#fff;font-size:12.5px;font-weight:600;letter-spacing:.3px;
  -webkit-backdrop-filter:blur(10px) saturate(1.3);backdrop-filter:blur(10px) saturate(1.3);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 6px 18px rgba(0,0,0,.18);
  transition:background .2s,transform .2s,box-shadow .2s}
.wb-home:hover{background:rgba(17,24,39,.78);transform:translateY(-1px);box-shadow:0 10px 24px rgba(0,0,0,.26)}
.wb-home:active{transform:translateY(0)}
.wb-home svg{width:13px;height:13px;flex:0 0 auto}
@media (max-width:620px){ .wb-home{left:10px;bottom:10px;padding:7px 11px 7px 9px;font-size:12px} }
</style>

<body>
<header>
  <h1>📈 函数拟合器</h1>
  <span class="sub">丢一堆散点进去 · 11 种模型自动找出最像的函数</span>
  <a class="home" href="https://startian.top/">← 返回主页</a>
</header>
<main>
  <section class="card">
    <h2>SCATTER · 散点画布</h2>
    <canvas id="plot"></canvas>
    <div class="btns">
      <button class="primary" id="btnLin" type="button">🎲 撒线性点</button>
      <button id="btnQuad" type="button">🎲 撒抛物线点</button>
      <button id="btnCub" type="button">🎲 撒三次点</button>
      <button id="btnExp" type="button">🎲 撒指数点</button>
      <button id="btnSin" type="button">🎲 撒正弦点</button>
      <button id="btnGauss" type="button">🎲 撒钟形点</button>
      <button id="btnRecip" type="button">🎲 撒反比点</button>
      <button id="btnClear" type="button">🧹 清空</button>
      <label class="noise">噪声 <input type="range" id="noise" min="0" max="300" value="120"><b id="noiseV">1.2</b></label>
    </div>
    <p class="tip">点击画布加点 · 右键删除最近的点 · 也可以在下面粘贴数据（每行 x,y 或 x y）</p>
    <div class="data-row">
      <textarea id="dataIn" placeholder="1,2.1&#10;2,3.9&#10;3,6.2&#10;4,8.1&#10;5,9.8"></textarea>
      <button id="btnParse" type="button">导入<br>数据</button>
    </div>
  </section>
  <section class="card">
    <h2>FIT · 拟合结果（实时）</h2>
    <div class="fits" id="fits"></div>
    <p class="tip" id="fitTip" style="margin-top:12px">点越多越准；金色边框 = 当前最像的函数（按调整 R² 排名，同分时更简单的函数优先）。</p>
  </section>
</main>
